known_bugs:
  - severity: medium
    note: "function_traits preserves arg cv/ref verbatim, so a by-value vs by-const-ref detour parameter changes method_arg_tuple_t element types. args_tuple_t is std::tuple<argument_types...> UNMODIFIED, so `const std::unique_ptr<W>&` yields a const-ref tuple element while `std::unique_ptr<W>` yields a value element. Both happen to work because is_java_double_slot_v and extract_frame_arg both call remove_cvref_t internally, but nothing in the trait normalises the tuple — the two detour spellings are different instantiations and any future code inspecting element types directly (without remove_cvref_t) diverges by parameter spelling. Hazard, not a live miscompile."
  - severity: medium
    note: "Overloaded, templated, or generic-lambda operator() silently falls through to the undefined primary template -> confusing hard error. The functor specialisation takes &F::operator() as a non-overloaded, non-template member pointer; a generic lambda ([](auto&...){}) / a two-overload functor / a templated operator() makes &F::operator() ill-formed, the void_t probe drops, and function_traits<F> resolves to the undefined primary -> 'no member named args_tuple_t' at the hook<T> instantiation. The library requires a single concrete operator() but never says so and has no static_assert for a readable diagnostic."
  - severity: low
    note: "No verification that the stripped-off first arg is actually vmhook::return_value&. tuple_tail blindly drops element 0; a user who forgets the return_value& and writes (std::unique_ptr<W>, int) has the chain silently treat the self wrapper as the return-value slot and shift every Java arg by one — self is discarded and int is read from slot 0 (the receiver's compressed-oop bits) -> garbage, no compile error. A static_assert(is_same_v<tuple_element_t<0, all_args_tuple_t>, return_value&>) would catch the most common authoring mistake."
  - severity: low
    note: "function_traits does not strip a leading ref-qualified (operator() & / &&) or volatile-qualified operator(). There are member-pointer specialisations for const, non-const, const-noexcept and noexcept only; an lvalue-ref-qualified or volatile hand-written functor falls to the undefined primary. Plain lambdas never hit this; an honest gap in the specialisation set."
notes: |
  Honest scope: the eight populated function_traits specialisations and the two
  tuple_tail specialisations are individually CORRECT for the inputs they match
  (proven by the existing static_asserts). Every remaining flaw is either an
  undefined-input gap or a missing-contract-check hazard — there is no case where
  a well-formed, correctly-shaped detour decomposes to the wrong tuple. NOTE: the
  agent def predates this header — the zero-param tuple_tail<std::tuple<>> gap and
  the missing noexcept member specs it lists are FIXED here (9229 / 9187 / 9193).

  Test coverage: three complementary pure-logic (no-JVM) files. test_traits.cpp
  drives exhaustive compile-time truth tables over a type zoo (is_java_double_slot_v,
  java_slot_offsets tables, shadow guards on is_unique_ptr/is_vector, dependent_false_v).
  test_traits_extra.cpp owns the decomposition CHAIN (function_traits -> tuple_tail
  -> java_slot_offsets, cv/ref convergence, the value_type-shadow regression guards).
  test_traits_function_traits.cpp owns the callable-SHAPE axis (all eight
  specialisations incl. noexcept, the args_tuple_t-only contract, return-type
  irrelevance). The runtime proof that the decomposition reads the right slots
  end-to-end is owned by the JVM hook-install modules, not here.

  JDK-independence: function_traits / tuple_tail / is_java_double_slot_v /
  java_slot_offsets are pure C++ compile-time templates — identical on JDK 8..26
  and every compiler. JDK variance only enters DOWNSTREAM in extract_frame_arg
  (compressed-OOP decode, register_class factory lookup) which consumes the tuple
  element types this chain names. The long/double 2-slot mapping is a HotSpot
  interpreter contract stable across all supported versions.
