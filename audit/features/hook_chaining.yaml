audit_docs: []
known_bugs:
  - severity: high
    note: "common_detour iterates g_hooked_methods lock-free (contract at vmhook.hpp:7049-7060); installing a NEW hook on another method push_back's to that vector and can reallocate it while a sibling method's detour is mid-iteration — UAF on the hook.detour std::function cell. The install mutex does not cover the reader. In the chaining scenario this is the central hazard because multiple hooks are added/dropped while the shared stub is live. Reserving capacity or a stable-address container closes it (shared with hook_basic / hook_common_detour_dispatch)."
  - severity: medium
    note: "First-match-and-return means only ONE g_hooked_methods entry per Method* can ever fire — if two distinct hooks were registered for the same Method* (a misuse), the second is silently dead. Correct for the documented one-hook-per-method model but undiagnosed; the duplicate-membership short-circuit at install partly guards this by returning early on a method already in g_hooked_methods."
notes: |
  Naming: "chaining" is the in-process SHARED-STUB consequence (many methods, one patched i2i stub, one
  trampoline, one common_detour demux), NOT the cross-DLL chain_resume path (a foreign DLL's 0xE9 JMP
  detected at find_hook_location and resumed after our detour). Module proofs: per-method fire counts;
  no cross-firing onto a sibling; single-entry drop (drop one handle, the others keep firing — the proof
  at the heart of leave-the-shared-trampoline teardown); install-order independence; allow-through; and
  per-detour return override. The first-match -> one-fire -> return structure of common_detour is the
  guarantee of "each detour fires for its method only, exactly once per call". Tests cover JDK 8..26
  HotSpot. Hooks via scoped_hook<T> that disarm on scope exit; the module leaves NOTHING armed and NEVER
  calls shutdown_hooks() (would tear down sibling modules' hooks). Java-8-only fixture; MSVC copy-init;
  every Method* / decoded-OOP deref gated by is_valid_pointer.
