schema_version: 1
slug: hook_chaining
title: Hook Chaining
category: hook
status: in_progress
risk: high
specialist: .claude/agents/hook_chaining-specialist.md
description: |
  Installing several `vmhook::scoped_hook<T>` on DIFFERENT Java methods at once, all of which share the
  ONE HotSpot interpreter-to-interpreter (i2i) stub vmhook patches a single time, and proving the single
  shared `common_detour` demultiplexes a mixed call stream so each method's detour fires for ITS method
  only — exactly once per call, with the correct frame, never cross-firing onto a sibling. The install
  path checks `g_hooked_i2i_entries` for an already-patched i2i entry and REUSES it, allocating a new
  `midi2i_hook` only when the entry is new: N methods sharing an i2i stub get N entries in
  `g_hooked_methods` but only ONE patched stub / ONE trampoline. Per-method teardown
  (`hook_handle::stop()`) erases just that method's entry and DELIBERATELY leaves the shared trampoline in
  place, so dropping one handle leaves the siblings firing. ("chaining" here is the in-process shared-stub
  consequence, NOT the cross-DLL `chain_resume` path.)
java_versions:
- 8
- 11
- 17
- 21
- 24
- 25
- 26
tags: [hook, chaining, shared-i2i-stub, demux, one-trampoline-per-entry, first-match, per-method-counts, single-entry-drop, install-order-independence]
hpp_anchors:
  - symbol: "hook<T> install — i2i reuse-or-allocate"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [10268, 10330]
    note: "scans g_hooked_i2i_entries for an already-patched entry and REUSES it; only on a new entry calls find_hook_location (10279) and allocates a new midi2i_hook(target, common_detour, chain_resume) (10328), pushing into g_hooked_i2i_entries (10335)"
  - symbol: "i2i_hook_data"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7026, 7034]
    note: "associates one i2i entry point with its single midi2i_hook — the structural 'one trampoline per unique i2i entry' record"
  - symbol: "g_hooked_methods + g_hooked_i2i_entries"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7049, 7124]
    note: "N-methods registry (7049) vs the per-i2i-entry trampoline registry (7120); every install push_back's to g_hooked_methods but reuses a shared i2i entry"
  - symbol: "common_detour first-match demux"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7138, 7210]
    note: "the single shared detour; linear-scans g_hooked_methods and on FIRST hook.method == current_method fires that detour once and returns — a method with no entry simply never matches"
  - symbol: "hook_handle::stop() — per-entry teardown keeps shared trampoline"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [11128, 11175]
    note: "erases just this method's g_hooked_methods entry + clears its _dont_inline / NO_COMPILE, DELIBERATELY leaves the midi2i_hook trampoline installed because siblings may still share the i2i entry; common_detour simply skips a method missing from g_hooked_methods"
