known_bugs:
  - severity: medium
    note: "override_class_lookup(name, nullptr) does NOT seed a durable negative entry — find_class cache-hit (6348) is 'if (cached_klass && is_valid_pointer)' so null fails guard, falls through to erase (6363), and next find_class re-resolves non-null. Doc contract (10737-10738) is false; either doc is wrong or find_class should honor sentinel-null as real negative cache (10742-10753 vs 6348 disagree)."
  - severity: medium
    note: "override_class_lookup / reanchor_classes_via_oop poison process-global klass_lookup_cache (6304) with loader-specific copy, no ownership/revert tracking. Last-write-wins (10748 is =, not insert), no refcount, no restore-previous. Any caller must manually save+restore or corrupts global state for all downstream features (10742-10753, 10785-10807 vs 6304-6305)."
  - severity: low
    note: "find_class_via_oop leaks anchor_class_handle / name_string / classloader local refs on early-success paths — hand-rolls DeleteLocalRef through 8 return points (10660-10727) instead of RAII local_ref_bag pattern (like jni_find_class_with_context_loader uses 9553-9571); jni_oop_handle storage (10655) is intentionally not deleted (stack pointer)."
  - severity: low
    note: "find_class_via_oop dots name unconditionally (std::replace '/' to '.' at 10705-10706) so cannot resolve array names — '[Lx/Y;' becomes '[Lx.Y;' which ClassLoader.loadClass rejects. Anchor resolver for array element types always fails with no diagnostic (10705-10706)."
  - severity: low
    note: "klass_to_class_loader_oop / inherit_host_context_classloader cache OopHandle-vs-direct decision and VMStruct offset in static locals keyed off FIRST call (3256-3266, get_class_loader_oop). Benign in single JVM but layout decision frozen process-wide; returned loader oop is raw heap pointer (3277-3282) that relocating GC can move — only inherit_host_context_classloader_for_current_thread re-derives per attach (9794), new callers stashing result across safepoint read stale/garbage oop."
  - severity: low
    note: "No upper bound / dedup in reanchor_classes_via_oop's initializer_list, and partial failure is silent-partial. If 3 of 4 names resolve, 3 cache entries are mutated and function returns false (10803) — caller polling-until-true (10779-10781) re-overrides the 3 already-resolved on every poll, leaving cache in half-anchored state with no signal of which name failed (10785-10807)."
notes: |
  JDK-version sensitivities: ClassLoaderData::_class_loader layout differs (JDK 8-9 direct oop,
  JDK 10+ OopHandle); detected at runtime via VMStruct type_string (3264-3279). java_lang_Class._klass_offset
  (9523) is the single point decoding mirror to Klass*; absent on future JVMs returns nullptr with no symptom.
  Compact-strings / java.lang.String.coder (JDK 8 absent, 9+ present) is a generation marker. Bootstrap-loader
  is denoted by null _class_loader (valid result, not error, on 8..26). Minecraft net/minecraft/launchwrapper/Launch
  fallback (9642-9658) is legacy Forge path (Java 8-era), best-effort, cleanly misses on non-modded JVMs.
  ensure_current_java_thread (4120) attaches via JNI; uniform 8..26, returns false in no-JVM process (crash-safety guarantee).
