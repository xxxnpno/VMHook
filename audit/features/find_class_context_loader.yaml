known_bugs:
  - severity: high
    note: "override_class_lookup(name, nullptr) does NOT seed a working negative entry — doc claims it does (10737-10738), but find_class's cache-hit guard at 6348 requires non-null && is_valid_pointer(cached_klass), so cached nullptr fails and falls through to erase+fresh-walk (6361-6367). Null override is silently evicted on next find_class, making the negative-cache feature a no-op. Either the doc/test is wrong or the cache-hit path must honor a sentinel. This is the single most important correctness defect."
  - severity: high
    note: "find_class_via_oop(anchor_oop, name) / inherit_host_context_classloader_for_current_thread pass raw oops through JNI as fake handles (jni_oop_handle 9276-9281) — GC-move hazard. If a GC moves the object between the caller obtaining the oop and HotSpot reading it, the read is stale/garbage. The .wip module dodges this by passing self->get_instance() inside a detour (frame keeps it live), but the public API makes no such guarantee. A caller who stores an oop and later passes it to find_class_via_oop can crash."
  - severity: medium
    note: "reanchor_classes_via_oop poisons the shared cache on partial success with no rollback (10793-10806). On a mixed list where some names resolve and some don't, it overrides the resolvers but returns false. The caller naturally retries the whole list, but the already-overridden names are now pinned to the anchor loader's copy and a retry against a different anchor silently leaves the first anchor's klasses cached. No all-or-nothing semantic, no rollback, persistent process-wide poisoning."
  - severity: medium
    note: "find_class_with_context_loader always converts the name to dotted form for loadClass (9595-9607, identically in find_class_via_oop 10705-10707) but performs zero name validation. Empty string, leading/trailing slash, array descriptor [Ljava/lang/String;, primitive name int are all std::replace'd and handed to loadClass. Exceptions are swallowed by jni_exception_clear (correct), but the empty-name and array cases are untested. A dotted input (the .wip E6 does, line 375) double-no-ops the replace, creating an asymmetry with the '/'-keyed find_class cache."
  - severity: medium
    note: "Bootstrap-loaded app classes are invisible to the capture machinery (9753-9756), defeating host-context inheritance on -Xbootclasspath/a setups. If the host app's classes are appended to the boot classpath, every app class reads as bootstrap (null loader) and host_classloader_klass is never published — worker threads never inherit a useful context loader and the whole inheritance feature is silently inert. No diagnostic is emitted."
  - severity: low
    note: "get_class_loader_oop OopHandle path (3270-3278) reads the storage slot then reads the oop out of it — both safe_read_pointer-guarded against AV, but yields a moveable oop treated as stable. For comparison-only uses (bootstrap null vs app non-null) the value identity can shift under GC; null/non-null verdict is stable but pointer-equality assertions across a GC are not sound."
  - severity: low
    note: "First-attempt local refs are tracked in local_ref_bag but intermediate *_id/field_id values are not — by design (not JNI handles), but the asymmetry is fragile. A future JVM where GetMethodID returns a managed handle would leak. Documented as a maintenance hazard, not a current bug."
notes: |
  JDK-version sensitivities: (1) ClassLoaderData._class_loader layout — JDK 8-9 store direct oop, JDK 10+ store OopHandle (oop*); get_class_loader_oop branches on type_string=="OopHandle" (3264-3265, 3270-3279); a future JDK that renames or removes this VMStruct silently breaks bootstrap-vs-context comparison, capture, and inheritance. Verify on 8, 11, 17, 21, 25, 26. (2) String shape — pre-9 has value:char[] no coder; 9+ adds coder:byte. The .wip uses coder presence as generation marker but asserts value field on all versions; keep value as universal probe. (3) Thread.getContextClassLoader/setContextClassLoader — present on all JDKs but on freshly-attached worker the context loader is system/platform not app — the entire reason this feature exists. App-class resolution MUST be driven from real app thread (a detour), not off-thread. (4) Launch.classLoader — only exists on LegacyLauncher/Forge ≤1.12; on stock JDK the path is correctly skipped. (5) Platform-vs-application loader split (JDK 9+ module system) — getSystemClassLoader() returns app loader, platform loader sits between it and bootstrap; a jdk.* class may resolve via system-loader delegation on 9+ but not on 8; use java/lang/* and app classes for hard asserts, jdk.* as [INFO] only.
