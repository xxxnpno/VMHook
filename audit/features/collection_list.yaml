known_bugs:
  - severity: medium
    note: "No uncompressed-OOP path (lines 14814/14821/14852/14865, 15199-15201/15220-15222/15233-15235) — all list fields/slots/Node-links read as 32-bit narrow oops; -XX:-UseCompressedOops or large-heap targets silently return empty vectors with no diagnostic."
  - severity: low
    note: "linked_list_walk_items re-resolves first and pays mutex-locked find_field per node (15194 + 15214-15215); two g_field_cache_mutex lock/unlock per node = linear O(N) cost, not quadratic, but inefficient vs hoisting item/next offsets."
  - severity: low
    note: "LinkedList walk has no cycle detection; corrupt next forming a cycle is bounded only by size loop guard (15205), observable as duplicate element OOPs caught by distinct_ok / linkedlist_big_no_cycle_no_dup_nodes check."
  - severity: low
    note: "ArrayList size trusted without clamping to elementData.length (read at 14808, loop bound at 14819); cannot OOB read (get_array_element bounds-checks at 11572-11573) but yields phantom nullptr tail for size > capacity."
  - severity: low
    note: "Silent empty-vector on any failure (lines 14799/14811/14834/14845, 15644-15650) indistinguishable from genuinely empty list — no diagnostic on failed decode, wrong-shape klass, or compressed-oops-off."
notes: |
  Compressed oops (primary): entire feature assumes narrow-oop field/array/Node-link encoding; default heaps
  (< ~32 GB) on JDK 8..25 keep compressed oops on; -XX:-UseCompressedOops or large-heap targets break silently.
  VMStruct name fallback: decode_oop_pointer probes Universe::_narrow_oop._* (JDK 8-16) → CompressedOops::_narrow_oop._*
  (17-24) → CompressedOops::_* (25+) — future rename would return null base/shift and empty every vector.
  ArrayList layout stable across JDK 6..25 (elementData + size field names); array offsets (+12 length, +16 data)
  assume HotSpot header layout. LinkedList Node field names (first, item, next) stable JDK 7+; pre-7 Entry had
  different names. String readback in fixture tag() inherits compact-strings sensitivity (JDK 9+ coder vs JDK 8).
