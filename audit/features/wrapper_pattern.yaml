slug: wrapper_pattern
title: Wrapper Pattern
category: infra
status: in_progress
risk: high
specialist: .claude/agents/wrapper_pattern-specialist.md
description: |
  The CRTP base every typed Java-object wrapper inherits: `object_base` (the
  non-template base holding the raw decoded OOP) and `object<derived>` (the
  CRTP template that exposes static accessors via `typeid(derived)`). A
  wrapper instance is constructed from a live decoded oop_type_t (validated
  with is_valid_pointer at the supported value_t -> unique_ptr<wrapper>
  decode sites) and stored as a bare pointer in `instance` — NOT a JNI
  global ref, so it does not survive a relocating GC; lifetime is the
  detour / read window. `get_field`/`get_method` dispatch on a STATIC bit
  read from InstanceKlass._fields and on `static_method_only()`, so a
  single call site transparently reaches instance fields (instance+offset)
  vs static fields (java.lang.Class mirror + offset); method resolution
  walks the super chain and then the implemented-interface chain for
  default methods. The dynamic klass is resolved via `typeid(*this)` (or
  `typeid(derived)` on the static fallbacks) through `type_to_class_map`,
  so the wrapper MUST have been registered with `register_class<W>()`
  first or every accessor returns nullopt. Copy aliases the same OOP (no
  refcount); move transfers and nulls the source. Portable
  `static_field`/`static_method` accessors exist on every compiler; on GCC
  callers MUST use them from a static context because the deducing-this
  `get_field`/`get_method` overloads are still considered there. Blast
  radius is high: field_proxy, method_proxy, enum singletons, collections,
  and effectively every typed accessor reach the live JVM THROUGH a
  wrapper.
