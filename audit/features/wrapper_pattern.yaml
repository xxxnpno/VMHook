known_bugs:
  - severity: low
    note: "Instance get_field does not validate a non-null instance OOP. vmhook.hpp:17755-17762: the static branch validates the mirror with is_valid_pointer (17744), but the instance branch only null-checks `this->instance` and returns a field_proxy at `instance + offset` with no `is_valid_pointer(this->instance)` guard. A wrapper hand-constructed from a stale / garbage non-null OOP yields a proxy aliasing arbitrary memory; subsequent get()/set() reads or WRITES there. Masked in normal use because the supported build sites (value_t -> unique_ptr<wrapper>) validate before wrapping. Fix: symmetric is_valid_pointer(this->instance) before computing field_pointer. Pinned by the SAFE contract in tests/jvm/modules/wrapper_pattern.cpp gating every wrapped-OOP deref through is_valid_pointer (the *_oop_valid / safe-style assertions)."
  - severity: low
    note: "object_base defines no operator== and no hashing. Two wrappers naming the same Java object are not value-comparable; identity is only recoverable as raw-OOP equality (`a.get_instance() == b.get_instance()`). Makes wrappers awkward as map keys / set members and means equality is non-obvious — and the OOP is a bare decoded pointer (not a stable GC handle) so it is only meaningful within the detour / read window. Characterized as an [INFO] line plus the raw-OOP identity battery (`equality_same_instance_same_oop`, `equality_distinct_instances_differ`, `equality_alias_static_same_oop_as_instance`)."
  - severity: low
    note: "Mixed identity basis between instance and static resolution. The instance path resolves via typeid(*this) (dynamic type, vmhook.hpp:18104) while the static fallbacks use typeid(derived) (the CRTP parameter, e.g. 18670 / 18692). For correct CRTP (`class W : object<W>`) they agree; a misuse where the dynamic type differs from the CRTP parameter (e.g. `class D : object<Base>`) would resolve two different klasses from the two accessor families with no diagnostic. A misuse rather than a defect, but worth a note for deep wrapper hierarchies."
  - severity: medium
    note: "WRAPPER OOP DOES NOT SURVIVE A RELOCATING GC (no GC handle). `instance` is a bare decoded pointer (vmhook.hpp:18090); a wrapper held across a forced System.gc() may have its underlying oop relocated and the raw pointer becomes either stale-mapped or unmapped. After the harness GC-survival fix at 6d8f013 the wrapper_pattern module's mode-1 (forced System.gc() twice) is GUARDED: section 17 stops the auto-repair watchdog BEFORE the GC and os::safe_read-gates every post-GC oop-header read (the watchdog re-derefs stale Method* between 1000ms polls and otherwise tears the JVM on no-SEH toolchains). The previous unguarded form crashed MSVC. Lib follow-up: real GC survival would need a global_ref wrapping (project/global_ref) — currently INFO-gated in the module as `[INFO] wrapper_oop_post_gc_safely_readable={0|1}` rather than asserted."
  - severity: low
    note: "Name-hiding footgun, not a bug but a wrapper-author trap. A static member declared on a wrapper with the same name as an inherited accessor (the classic case: `static W& get_instance()` returning the singleton) HIDES `object_base::get_instance()`. An unqualified `w.get_instance()` then names the static, not the inherited raw-OOP accessor; reading the wrapped OOP requires the base-qualified `w.vmhook::object_base::get_instance()`. This is exactly what the library does at vmhook.hpp:9850 (`value->vmhook::object_base::get_instance()` inside field_proxy::set). The wrapper_pattern module pins the contract with `name_hiding_static_shadow_returns_wrapper` and `name_hiding_shadow_oop_equals_base_qualified_oop`."
notes: |
  Construction contract: the supported way to obtain a valid wrapper is
  `static_field("instance")->get()` (or a method_proxy value_t) returning
  `std::unique_ptr<W>`; the decoder validates with is_valid_pointer before
  `new W{decoded}`. A default-constructed wrapper (`W{}`) holds a nullptr
  OOP — static_field / static_method / get_method on it still resolve
  through the mirror / klass, but instance get_field returns nullopt.

  Portability discipline: instance methods use `get_field` / `get_method`;
  static wrapper methods MUST use the portable `static_field` /
  `static_method` (vmhook.hpp:18689-18711). On GCC the deducing-this
  overloads (gated by VMHOOK_HAS_DEDUCING_THIS) are still considered from
  a static-call context and error; MSVC/Clang correctly drop them and
  fall through to the string_view static fallback. The header documents
  this at 18619-18625.

  GC-survival caveat (see known_bugs medium entry): wrappers are NOT
  pinned. The 6d8f013 fix guards the wrapper_pattern test module's mode-1
  forced-GC section by stopping the auto-repair watchdog and
  os::safe_read-gating every post-GC oop-header read; the underlying
  lifetime gap remains. Callers needing GC survival must wrap through
  global_ref / jni_local_ref_hygiene.

  Test module covers ~104 ctx.check assertions across: registration +
  resolution; live-OOP construction with the name-hiding proof;
  instance + static field dispatch for every primitive + String; null-OOP
  wrapper edge case; instance vs static method dispatch with
  is_static()/name()/signature() parity; overload resolution by
  name+signature; value semantics (copy alias, move transfer + null);
  raw-OOP equality; type-registry gate (unregistered wrapper -> nullopt
  everywhere, no crash); and live post-dispatch state inside a
  scoped_hook detour (self wrapper non-null + OOP-matches instance,
  in-detour method_proxy::call gated [INFO], post-putfield aliasing of
  the live heap).
