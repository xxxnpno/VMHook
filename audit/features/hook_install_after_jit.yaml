known_bugs:
  - severity: high
    note: "ARM64 store reordering between _from_compiled_entry write and _code=nullptr can hand HotSpot a stale-entry/null-code combination that crashes at the next safepoint. set_code / set_from_compiled_entry / set_from_interpreted_entry (vmhook.hpp:10295-10299) are plain non-atomic stores with no memory barriers; on ARM64 (VMHOOK_ARCH_ARM64, vmhook.hpp:176) the CPU may commit _code=nullptr before the _from_compiled_entry=c2i write is visible to another core. Same reordering hole exists in the sweep path (deoptimize_methods_if write trio) and the verify_hooks repair path. Fix: release store or std::atomic_thread_fence(memory_order_release) before each set_code(nullptr) call."
    ref: "audit/findings/hook_install_after_jit.md"
  - severity: medium
    note: "was_compiled is captured before NO_COMPILE propagates (vmhook.hpp:10147) and the deopt branch at 10287 re-uses the stale snapshot instead of re-reading _code. An in-flight JIT completion after the snapshot produces install returning true with _code non-null and _from_compiled_entry never redirected; the watchdog repairs this within VMHOOK_AUTO_REPAIR_INTERVAL_MS (default 1000 ms) but hook misses every compiled call in that window."
    ref: "audit/findings/hook_install_after_jit.md"
  - severity: medium
    note: "Stale inline caches in already-compiled callers bypass the hook even after per-hook deopt. The install deopt clears _code and redirects _from_compiled_entry (vmhook.hpp:10297), which catches fresh IC resolutions, but compiled callers whose monomorphic IC already cached the nmethod's verified-entry-point skip _from_compiled_entry entirely. The README overstates coverage; the correct workflow requires deoptimize_all_jit_compiled_methods() after hook install to flush stale ICs."
    ref: "audit/findings/hook_install_after_jit.md"
  - severity: medium
    note: "set_code(nullptr) silently no-ops when the VMStructs Method::_code entry is missing (vmhook.hpp:10299 calls set_code which early-returns at ~2347 if iterate_struct_entries returns null). The success log at 10300-10301 prints regardless. Install reports deopt complete but _code was never cleared; compiled callers continue to bypass the hook with no diagnostic."
    ref: "audit/findings/hook_install_after_jit.md"
  - severity: low
    note: "c2i-unrecoverable fallback policy diverges between per-hook install and deoptimize_methods_if sweep: install (vmhook.hpp:10317-10318) forces deopt anyway (clears _code, redirects interpreted entry only), accepting one-cycle stale-IC bypass; the sweep (vmhook.hpp:8267-8286) bumps skipped_no_c2i and leaves the method JIT-compiled. Users pairing both paths can observe inconsistent deopt behaviour for the same method depending on which path ran first."
    ref: "audit/findings/hook_install_after_jit.md"
notes: |
  JDK-version sensitivities for the deopt path. On JDK 8, Method::_adapter is exported via
  gHotSpotVMStructs so get_adapter() (vmhook.hpp:2499-2548) takes the fast path and c2i
  recovery is deterministic. On JDK 9+ the field was removed from VMStructs; recovery falls
  back to detect_adapter_offset_from_method (vmhook.hpp:6155-6251), a heuristic scan that
  has been observed to succeed on JDK 17/21/24/25 (preferred-guess slot immediately before
  _from_compiled_entry) but may fail on unknown or stripped JVM builds. When recovery fails
  the install takes the c2i-unrecoverable fallback at vmhook.hpp:10303-10322: _code is
  cleared and _from_interpreted_entry is redirected to the i2i stub, but _from_compiled_entry
  is left pointing at the (now stale) nmethod. Compiled callers with stale ICs will call
  the old nmethod for one more cycle, then the IC is repaired at the next safepoint.

  OSR (On-Stack Replacement) compiled frames are NOT covered by the deopt path. Per-hook
  install deoptimises the Method* entry points so future dispatch routes through the
  interpreter, but threads currently executing an OSR-compiled frame for the hooked method
  continue in the OSR nmethod for the lifetime of that activation. The hook will not fire
  for those in-flight OSR frames; it fires on the next fresh invocation after the frame
  unwinds. This is a fundamental limitation of entry-point-level hooking versus full
  HotSpot safepoint-driven deoptimisation.

  The auto-repair watchdog (vmhook.hpp:10325-10328) is the only defence against re-JIT
  after install. HotSpot can race an in-flight compilation through the NO_COMPILE policy
  gate before the flag is visible to the compiler thread. Watchdog poll interval is
  VMHOOK_AUTO_REPAIR_INTERVAL_MS (default 1000 ms); during that window a re-JIT'd method
  bypasses the hook entirely. The watchdog is disabled during the functional test suite
  (b738d6c) to avoid cross-tick poll raw-derefs on clang/mingw where no SEH is available.

  Three sites in vmhook.hpp perform the same three-store deopt dance (per-hook install at
  10295-10299, deoptimize_methods_if sweep at ~8251-8287, verify_hooks repair at ~8265-8273)
  but have drifted in their c2i-fallback policy and logging detail. A shared
  apply_method_side_deopt(method*, void* i2i) helper would unify the fix for the ARM64
  ordering bug and the was_compiled stale-snapshot race across all three sites.
