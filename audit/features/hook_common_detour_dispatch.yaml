known_bugs:
  - severity: high
    note: "Only `thread` is validated (vmhook.hpp ~7152), NOT `frame_pointer`. common_detour reads frame_pointer->get_method() with no is_valid_pointer gate on the frame itself; get_method() is internally os::safe_read-gated so a torn/cold frame yields nullptr (no match, original body runs) rather than an AV, but the absent explicit frame guard is a structural asymmetry."
  - severity: high
    note: "The lock-free scan of g_hooked_methods relies on the documented contract that the vector is only mutated from the setup thread BEFORE detours fire. A hook<T>() push_back that reallocates the vector while a sibling detour is mid-iteration is a UAF on the hook.detour std::function cell — the install mutex does not cover the reader (shared with hook_basic; documented in-source). A stable-address container would close it."
  - severity: medium
    note: "seh_invoke_detour is a real SEH firewall ONLY on cl.exe MSVC (_MSC_VER && !__clang__); on MinGW and clang-on-windows it is plain catch(...) which cannot trap a hardware AV inside the user detour — a wild deref in a user lambda is uncontained on those toolchains and tears the JVM down."
notes: |
  This feature is the dispatch hot path, not the install path, argument decoding, or return_value
  semantics — it is the lock-free function that decides WHICH detour fires for THIS Method* and that it
  fires EXACTLY ONCE per call. No dedicated test module exists: the contract is exercised end-to-end
  through hook_basic.cpp (exactly-once-per-call counting), hook_chaining.cpp (first-match demux across
  several methods sharing one i2i stub), and hook_install_after_jit.cpp (dispatch after deopt). The
  first-match -> one-fire -> return structure is the proof of "each detour fires for its method only,
  exactly once per call"; the shutdown bail being reversible (reset at shutdown_hooks() end, vmhook.hpp:11113)
  is what makes re-install after teardown revivable (see hook_reinstall_after_shutdown). The trampoline ABI
  is detour_function_t = void(*)(frame*, java_thread*, return_slot*); the trampoline pushes a zeroed
  return_slot on the native stack and common_detour leaves return_slot->cancel == false so the original
  body runs unless a detour flips it via return_value::cancel()/set().
