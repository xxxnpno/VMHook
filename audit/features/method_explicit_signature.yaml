known_bugs:
  - severity: low
    note: "Instance overload sets a phantom `this` for STATIC methods: it always passes this->instance as the owning object even when the matched Method* is JVM_ACC_STATIC (the static overload correctly passes nullptr). Calling obj.get_method(\"smap\",\"(I)I\") on an instance handle to a static method yields a proxy whose object != nullptr, so call() pushes a bogus receiver into slot 0 and shifts the real arg one slot too high. Fix: peek get_access_flags() for JVM_ACC_STATIC and pass nullptr when static. The module sidesteps it by using static_method(name,sig) for the static family."
  - severity: low
    note: "Empty signature is a silent strict-miss with a misleading log: get_method(name, \"\") can never match (every real descriptor starts with '(') so it returns nullopt and logs the generic 'no method with this exact name+signature found', diverging silently from how hook<T>(name, signature) treats an empty signature."
notes: |
  The exact-match comparison has zero looseness, so defineClass(String,[B,I,I,
  ProtectionDomain) cannot be confused with any sibling overload; the match logic
  is solid and the only way to 'lose' an explicit selection is to call with C++
  args that don't match the descriptor you asked for (user error, not a lookup
  flaw). resolve_compatible_method FIRST checks signature_matches_arguments and
  returns this->method unchanged when the proxy's own signature already matches —
  so even combo(CharSequence) vs combo(String) is honored because a single L...;
  parameter matches std::string. Java fixture; the module pins the static family
  via static_method to avoid the phantom-this flaw.
