known_bugs:
  - severity: high
    note: "[headline bug, now fixed; the module is its regression wall] The call-stub default arm used to be value_t{static_cast<uint32_t>(result_holder)}, which truncated the 64-bit oop AND mislabelled it as a compressed OOP, so a Ljava/lang/String; call() returned \"\" on JDK 8/11/17 (call-stub present) while the JNI path returned the text. Now decodes via read_java_string on the stub and GetStringUTFChars on call_jni. The interior-NUL case (a\\0b) is the sharpest guard (a naive C-string copy would terminate at the NUL)."
  - severity: high
    note: "[STILL LIVE divergence] The two decoders produce DIFFERENT bytes for the same Java String: GetStringUTFChars (call_jni) preserves unicode as modified UTF-8 (BMP correct, supplementary as CESU-8 surrogate pairs), while read_java_string (call-stub) substitutes '?' for every code unit >= 0x80 and rejects strings longer than 4096. So a non-ASCII or >4096-char String returns different content depending on which dispatch path the live JDK takes — only ASCII <= 4096-char strings round-trip identically on both."
notes: |
  CI actually takes the call_jni path (_call_stub_entry is absent from VMStructs on
  every JDK CI runs: 8, 11, 17, 21, 24, 25). read_java_string rejects length <= 0
  (so the empty string returns "" on the call-stub path) and length > 4096; the
  coder branch handles JDK 8 char[] vs JDK 9+ LATIN1 (raw byte copy) / UTF16 ('?'
  for >= 0x80). The module uses as_string() everywhere (never the implicit
  conversion), installs a scoped_hook on trigger(), captures results into a
  mutex-guarded map, and asserts after run_probe. To keep the two decoders from
  diverging, the fixture strings are ASCII; the unicode/interior-NUL cases are
  characterized as known divergences, not hard-asserted equal across paths.
  Java-8-only fixture; call() runs inside the trigger() detour.
