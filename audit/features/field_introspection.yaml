known_bugs:
  - severity: high
    note: "raw_address() has GC-staleness risk: instance fields return cached oop+offset without pinning or live-mirror re-resolution; a relocating GC can invalidate the oop after lookup, leaving raw_address pointing to a stale heap location (lines 15546-15549). Static fields similarly return field_pointer (mirror+offset) without live-mirror validation at read time."
  - severity: medium
    note: "get_compressed_oop() reads exactly 4 bytes (lines 15648): reading low 32 bits of a 64-bit J/D field yields garbage in the high word. Caller must account for double-width primitive fields (e.g., Long/Double not addressable as compressed OOP slots)."
  - severity: medium
    note: "get_compressed_oop() pre-FLAW-C accepted primitive fields and returned bogus decoded pointers: lines 15596-15605 now guard on is_reference(), returning 0 for primitives, but the function signature carries no type safety — misuse (calling on a non-reference field) still type-checks."
notes: |
  JDK-sensitive: signature descriptors match Java 8–26 type system exactly
  (primitives Z/B/S/I/J/F/D/C, refs Ljava/lang/..., arrays [...). GC
  behavior (mirror relocation, class unloading) varies by JDK version; Mode 2
  fixture forces GC between lookups to document raw_address staleness.
