known_bugs:
  - severity: medium
    note: "The size guard is a SIZE guard, not a TYPE guard — same-width wrong-KIND writes silently reinterpret bits (vmhook.hpp:12167-12182). A set(float{1.5f}) into an \"I\" field, set(std::int32_t) into \"F\", set(double) into \"J\", or set(std::int64_t) into \"D\" all have matching widths, pass the guard, and memcpy the raw IEEE-754 / two's-complement bit pattern verbatim. No diagnostic. Documented and characterised by the sibling JVM module (field_set_size_guard.cpp phase 6), not fixed — a future signature-aware type check would reject these. The pure-logic test currently does NOT pin these same-width confusions."
  - severity: low
    note: "signed char / plain char sign-extension is invisible to the width oracle for non-\"C\" 1-byte fields (vmhook.hpp:12148-12153 vs. 12182). The widening shortcut only fires for signature_text == \"C\". A set(std::int8_t{-1}) into a \"B\" field passes the size guard (1 == 1) and memcpy's the single byte 0xFF — correct for a byte field, but the shortcut's unsigned-cast semantics are a silent contract. Not a corruption bug, but an asymmetry worth a regression pin."
  - severity: low
    note: "const char* reaches the string arm only via implicit string_view conversion, and a char[N] array decays the same way — but a std::array<char,N> or other 'stringy' container does NOT (vmhook.hpp:12076, 12099). A std::array<char,4> is NOT string_view-convertible and falls through to the trivially-copyable arm, treated as a 4-byte primitive blob. For an \"I\" field the array's 4 bytes are memcpy'd as an int (size matches) rather than refused. Low severity (callers rarely do this) but a real edge of the guard's type set."
  - severity: low
    note: "Guard predicate mixes value_type and clean_value_type (vmhook.hpp:12075-12078). The string_view-convertibility sub-clause tests value_type (raw, possibly-ref type) while vector/unique_ptr sub-clauses test clean_value_type. In practice is_convertible_v is ref-tolerant so this is benign today, but the asymmetry is a latent hazard if someone later swaps the predicate to a trait that is NOT ref-tolerant. The test should pin a const std::string& lvalue path to lock current behaviour."
notes: |
  The guards themselves are JDK-independent — both run on the in-memory signature_text + a raw pointer; jvm_primitive_byte_width only inspects the descriptor string.
  There is no HotSpot struct access on the rejection paths, so the pure-logic test is identical on every JDK and on every host with no JVM at all.
  The danger the non-primitive guard blocks IS JDK-shaped (relevant only to the success/JVM side): set_str_field -> write_java_string branches on backing array signature — [C (JDK 8 char[], writes uint16 per char) vs. else byte-array path (JDK 9+ compact-strings byte[]/LATIN1, writes uint8).
  If the guard ever regressed, the corruption a primitive field would suffer differs by JDK.
  The sizeof(wchar_t) host-platform split (Windows 2 / Linux-Mac 4) is the only place this feature's behaviour (accept vs refuse a wchar_t into "C") changes across the CI matrix — it is a C++ ABI difference, not a JDK one.
