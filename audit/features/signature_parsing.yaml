known_bugs:
  - severity: medium
    note: "sig_char_to_basic_type collapses malformed/unknown return descriptors into T_OBJECT (vmhook.hpp:15969 default->12), then the call-stub trusts it as a real object return. A signature whose post-`)` char is junk (or a primitive in the wrong case, e.g. 'i') is classified T_OBJECT, so the decode default path treats an arbitrary primitive/garbage return-register value as an oop pointer. Never triggers for a well-formed signature, but converts a malformed one from a clean void/no-op failure into a heap-pointer misinterpretation. A defensive helper would map unknown -> T_VOID (14), the same value the rparen==npos path already uses."
  - severity: low
    note: "ret_char = sig[rparen + 1] indexes one past the last ')' with no bounds check (method_proxy::call return-parse). For a degenerate-but-non-empty signature that ENDS in ')' (e.g. \"()\" or \"(I)\" with the return char chopped) rparen+1 == size(), so operator[](size()) is read — UB on std::string_view (unlike std::string). Descriptors from live Method::_signature are always well-formed, but call() accepts a caller-supplied override signature, making this reachable from user input."
  - severity: low
    note: "uint16_t -> \"C\" is asymmetric with the BasicType table and with int16_t -> \"S\". jni_signature_for_arg<uint16_t> deliberately encodes Java char (C) so the round-trip is self-consistent, but a user passing `unsigned short` expecting a numeric 16-bit Java short silently gets a char parameter and GetMethodID then fails to match a (S)-taking overload with only a generic 'method not found' log. Documented design choice; the single most surprising row — every consumer/test must assert it explicitly so it never drifts."
  - severity: low
    note: "Class-map fallback to Ljava/lang/Object; for an UNregistered wrapper produces a compilable, plausible, WRONG descriptor. A constructor taking Lcom/example/Foo; will not match Ljava/lang/Object;, so jni_make_unique fails at GetMethodID with only a VMHOOK_LOG warning. Honest hazard for callers who forget register_class<T>()."
notes: |
  The three core tables themselves are correct against JVMS § 4.3.2 and the
  HotSpot BasicType enum (T_BOOLEAN=4 .. T_VOID=14, unchanged JDK 8 -> 26). All
  the risk is at the EDGES: unknown-char policy, the unbounded [rparen+1] read at
  the call site, and the heap-width-vs-C++-sizeof coupling (jvm_primitive_byte_width
  reports HEAP width but is also reused to gate value-size comparisons; the
  char->C widening special-case lives OUTSIDE this helper at the call site, so any
  future reuse of the width helper for a new size guard must replicate it).

  Test coverage: tests/test_signature_parsing.cpp (dedicated pure-logic) asserts
  every valid char -> exact BasicType int plus fallback cases, all 8 primitives ->
  {1,2,4,8} plus the zero cases (V/object/array/bare L/empty/unknown/multi-char),
  the full jni_signature_for_arg<T> table incl. the uint16->C split and cv/ref
  stripping, and return-descriptor extraction (return_basic_type_of reproducing the
  rfind(')')+1 call-site). tests/jvm/modules/signature_parsing.cpp is the live-JVM
  backstop that the emitted descriptors actually match real Method entries. The
  sibling JVM modules find_methods_by_signature / hook_signature /
  method_explicit_signature exercise signatures end-to-end but are owned by other
  features (resolve/dispatch is out of scope here).

  JDK-version sensitivity is essentially nil for the parsing itself: BasicType ints
  and the descriptor grammar are version-invariant; differences live downstream
  (which call-stub / JNI path consumes the parsed BasicType). char-signedness is a
  host (MSVC/MinGW signed char), not JDK, concern — high bytes route to default.
