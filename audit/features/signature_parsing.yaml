    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [16940, 16960]
    note: "there is no named parse_signature function — this inline rfind(')')+1 IS the return-parse; ret_char fed to sig_char_to_basic_type, result passed to the call-stub as the BasicType while the C++ result is decoded by a SEPARATE switch on the raw char"
