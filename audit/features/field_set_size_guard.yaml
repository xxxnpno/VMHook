    note: "maps JVM primitive signatures (Z/B/C/S/I/J/F/D) to byte widths; 0 for non-primitives"
  - symbol: "field_proxy::set(const value_type&) — non-primitive guard"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [15371, 15399]
    note: "rejects string/vector/unique_ptr writes on primitive fields (fires if jvm_primitive_byte_width != 0)"
  - symbol: "field_proxy::set(const value_type&) — char widening shortcut"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [15460, 15486]
    note: "auto-widens 1-byte C++ char to 2-byte uint16 for Java 'C' field (if constexpr guards non-arithmetic types)"
  - symbol: "field_proxy::set(const value_type&) — size-mismatch guard"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [15488, 15516]
    note: "refuses trivially-copyable write if sizeof(value) != jvm_primitive_byte_width(sig); prevents clobber of adjacent fields"
