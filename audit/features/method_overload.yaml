known_bugs:
  - severity: high
    note: "Static-overload resolution is DEAD: resolve_compatible_method bails `if (!resolved) return this->method` and every static method_proxy is built with object==nullptr, so STATIC overloads never re-pick. On JDK 21 (call stub absent) the bug is LIVE. The module records every static-overload outcome as [INFO], never fails CI for it, but DOES hard-assert the explicit-signature static path static_method(\"spick\",\"(D)I\") which bypasses resolution, proving the fixture is sound."
  - severity: medium
    note: "First-match-wins with no ambiguity detection for an UNREGISTERED wrapper arg: argument_matches_descriptor falls back to a WILDCARD L...; match for a wrapper type that was never register_class<>'d, so the first name-matching overload with any reference parameter is taken with no ambiguity signal. Characterized, not failed."
notes: |
  Each Java pick(...) overload in the fixture returns a DISTINCT int sentinel so a
  mis-resolution is caught as a VALUE mismatch (not a crash, not 'some int came
  back'). The module records which dispatch path is live via find_call_stub_entry()
  and asserts the converted value_t (path-independent). argument_matches_descriptor
  handles the two-slot J/D types in the param walk; call((int64_t)x) on a name-only
  proxy with both int and long overloads picks long; signature_pinned (set by
  get_method(name,sig)) forces the exact overload verbatim. Java-8-only fixture,
  ASCII strings (so read_java_string vs GetStringUTFChars never diverges). call()
  runs inside the detour where current_java_thread is live.
