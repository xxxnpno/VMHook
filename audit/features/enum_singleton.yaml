known_bugs:
  - severity: high
    note: "Reference-field read hard-codes compressed OOPs; -XX:-UseCompressedOops silently mis-decodes every enum singleton. field_proxy::get() reads reference field as 4-byte uint32_t (12045-12048) and cast_for_variant feeds it to decode_oop_pointer (11838, 4350-4351) unconditionally. When compressed oops are OFF (heaps ≳32 GB or explicit flag), field is 8-byte raw pointer: reading 4 bytes grabs half, base/shift mangles further. is_valid_pointer then rejects bogus address, acquire_constant returns nullptr, safe_rgb yields -1, tests FAIL. Feature genuinely does not support uncompressed-oops JVMs. Fix: branch on UseCompressedOops and read 8 bytes when OFF."
  - severity: medium
    note: "is_valid_pointer is range/alignment/sentinel test, not mapped-page probe — decoded-but-unmapped enum OOP can fault rgb read. safe_rgb gates on is_valid_pointer (1768-1805) before get_rgb() but function never touches page; compressed value decoding to user range yet pointing at freed/never-mapped page passes gate and subsequent instance+offset load (14091) takes access violation. For live enum singletons strongly reachable for JVM lifetime never triggers (module is green) but safety claim in header is overstated: only is_readable_pointer/SEH-guarded read gives guarantee. Low real-world risk, medium because stated invariant false."
  - severity: low
    note: "acquire_constant mistyped-name path indistinguishable from genuinely-absent-static failure. static_field → get_field(type_index, name) returns std::nullopt for both 'field not found' and 'field not static' (14123-14135); acquire_constant collapses to nullptr (enum_singleton.cpp:127-129) with no diagnostic. Typo in constant name degrades to silent *_resolves==false FAIL with no hint which cause fired. Not library bug per se but sharp edge for authors copying pattern."
notes: |
  Field-record decode format split (vmhook.hpp:3015-3121): JDK 21+ uses _fieldinfo_stream (3042-3045); JDK 8–17 uses 6-slot Array<u2> _fields (3047-3118), with JDK 8 trailing _java_fields_count u2 tolerated via integer division (3065-3068, 3086). Compressed-oops VMStruct rename drift (decode_oop_pointer 4296-4340): base/shift live under Universe::_narrow_oop.* (JDK 8–16), CompressedOops::_narrow_oop.* (17–24), CompressedOops::_base/_shift (25+); all three probed; missing VMStruct returns nullptr, collapses every reference decode to clean FAIL (flaw #1). Compressed-oops ON/OFF (flaw #1): default sub-32 GB heap enables them; feature only works in that mode. Native-call gate variance (method_proxy::call 13199-13247): JDK ≤17 usually exposes StubRoutines::_call_stub_entry so call-stub path fires; JDK 21+/25 frequently absent, falls to JNI path (13225) needing ensure_current_java_thread(). brightness() can succeed on some JDKs even without hook (call() attempts OS-thread attach), so assertion best-effort: assert 0xFF when succeeds, [INFO]+soft-pass when gate unavailable. identityHashCode width: Java witnesses are int; collisions across three fresh singletons vanishingly unlikely; Java-side distinctness cross-check (enum_singleton.cpp:427) corroborates OOP-level distinctness rather than replacing. No compact-strings / MethodFlags sensitivity applies.
