known_bugs:
  - severity: high
    note: "jni_delete_global_ref silently skips the JNI call when current_jni_env has no table entry for slot 22 (e.g. during early bootstrap or after a detach), leaving the handle leaked with no diagnostic — the destructor returns without releasing the pin, so the object is never collected."
  - severity: high
    note: "oop() tag-mask is hardcoded to 0b111 (3 bits); if a future HotSpot build widens the tag to 4+ bits the mask is insufficient and oop() returns a misaligned, garbage address that will AV on first field read — no version guard or assertion exists."
  - severity: medium
    note: "The synthetic jni_oop_handle stack slot (handle_storage in the constructor body, line 21240) is in-scope for the NewGlobalRef call but there is no fence preventing the compiler from eliminating it as unused after the assignment; on aggressive optimisation levels this is undefined behaviour (reading through a pointer to a destroyed local)."
  - severity: medium
    note: "global_ref has no jclass / jarray distinction — a jclass global ref and a jobject global ref share the same handle_ field and oop() path; code that attempts to pass handle() back to a JNI function expecting specifically jclass (e.g. FindClass cache) gets silent undefined-behaviour from the implicit C cast."
  - severity: low
    note: "reset() calls jni_delete_global_ref then nulls handle_, but if the detour thread is detached at the time of reset() (current_jni_env == nullptr), jni_delete_global_ref silently no-ops (slot-22 lookup fails), the handle is not released, and handle_ is set to nullptr — effectively a silent leak with no log line."
notes: |
  The comment block immediately above the jni namespace (lines 21195-21201) documents the
  use-after-relocation hazard that motivates global_ref; it is a useful anchor for reviewers
  unfamiliar with the feature.

  jni_oop_handle is a deliberate ABI shim: JNI functions expect a pointer-to-OOP (jobject is
  void**, not void*), so passing the raw OOP directly would be a type mismatch.  The stack
  storage trick avoids allocating a real JNI local frame but means the synthetic handle
  lifetime is bounded to the constructor scope — NewGlobalRef must be called before the
  constructor returns, which it is.

  The move-assign path correctly releases the *current* handle before taking ownership of
  other.handle_ (line 21262), so no double-release occurs on move-assign.  Self-move is
  guarded by the `this != &other` check (line 21260), leaving handle_ intact.

  wrapper_pattern (object<T>) stores a raw decoded OOP; global_ref stores a JVM-maintained
  slot.  They serve different lifetime requirements: object<T> is valid for the duration of
  a single detour tick; global_ref is valid until explicitly released.
