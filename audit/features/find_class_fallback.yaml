tags: [klass, class-lookup, name-cache, class-loader-data-graph, jni-fallback, context-loader, stale-cache, internal-name]
hpp_anchors:
  - symbol: "vmhook::find_class(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8004, 8105]
    note: "real resolver — empty-name fast-reject (8019), cache lookup + stale-revalidate, graph walk (8073), JNI fallback on miss (8077), insert into klass_lookup_cache (8088), capture_host_classloader_klass (8099); catch-all returns nullptr"
  - symbol: "stale-cache revalidation guard"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8048, 8067]
    note: "cache hit returns cached_klass only if is_valid_pointer AND its name symbol round-trips to the requested name; otherwise erase + log + fresh graph walk (RedefineClasses / unload defence)"
  - symbol: "class_loader_data_graph::find_klass(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [4462, 4540]
    note: "O(N*M) full graph walk — per-CLD Dictionary find_klass (4496/4527) plus the SystemDictionary fallback; the HotSpot-internal zero-JNI stage"
  - symbol: "detail::jni_find_class_with_context_loader(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [11951, 12195]
    note: "JNI fallback engine — ensure_current_java_thread, then ClassLoader.loadClass via thread context loader -> system loader -> Forge Launch.classLoader; always jni_exception_clear()s; logs all-paths-failed at 12189"
  - symbol: "jni::find_class_with_context_loader(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [13398, 13402]
    note: "public thin forwarder to the JNI fallback engine — driven directly from inside a detour (app context loader) in the module"
  - symbol: "klass_lookup_cache + mutex"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7987, 7988]
    note: "process-wide name->klass* cache guarded by klass_lookup_cache_mutex; insert (not assign) so a racing same-name resolve isn't clobbered"
