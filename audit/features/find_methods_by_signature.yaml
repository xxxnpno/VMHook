known_bugs:
  - severity: low
    note: "No descriptor validation -> malformed/typo'd descriptor indistinguishable from legitimate empty result. vmhook.hpp:7088 raw exact string compare with zero normalization; dotted form (Ljava.lang.String;)Ljava.lang.String; instead of slashed, whitespace-padded, lowercase, or near-miss (I)F returns empty silently with no log/diagnostic. Pinned by ~30-assertion malformed-descriptor battery (dotted, padded, lowercase, missing/unbalanced parens, garbage, NAME-as-descriptor, truncated L...;, foreign-class descriptor). Suggested fix: VMHOOK_LOG hint when descriptor non-empty but lacks ()."
  - severity: low
    note: "Doc/behaviour drift on inheritance: vmhook.hpp:7070 doc-comment says 'every method on T's class' which can read as resolved/inherited table; implementation walks only declared _methods (collect_klass_methods vmhook.hpp:6979-6998), excluding inherited java.lang.Object methods (equals, getClass). Correct for hook selector (you hook declared methods) but wording invites wrong expectation. Pinned by inherited_equals_descriptor_absent / inherited_getClass_descriptor_absent assertions. Suggested fix: doc 'every method DECLARED by T's class (incl. <init>/<clinit>, excl. inherited)'."
  - severity: low
    note: "Silent under-report on bad Method* slot: collect_klass_methods continues past slots failing is_valid_pointer (vmhook.hpp:6993-6996) with no diagnostic. Under class-redefinition race or corrupted _methods a real method silently vanishes, so descriptor that should be non-unique could appear unique. Hard to trigger without VM memory corruption; defensive-by-design. Suggested fix: VMHOOK_LOG on the skip."
  - severity: low
    note: "No caching: O(n) re-walk + per-name heap alloc on every call (vmhook.hpp:7086). find_methods_by_signature calls get_class_methods<W>() afresh, re-walking _methods and rebuilding vector<pair<string,string>> before filtering. Loop probing many descriptors against one class pays full walk+allocations each time. Not a correctness bug; get_class_methods cache keyed by klass would help hot selectors."
notes: |
  JDK-version sensitivities: JDK 8 emits extra synthetic `()V` accessor (javac nested-class
  access method); descriptor count for `()V` is >= 5 on JDK 8 and exactly 5 on JDK 11+ (verified
  with javap --release 8/11/17/21). All other distinctive descriptors are JDK-stable.
  Descriptors are internal form (slashed, no normalization). Feature does NOT require live
  current_java_thread (pure VMStruct read). Test fixture (example/vmhook/fixtures/FindMethodsBySig.java)
  verified with javap -s on all four JDK versions; 121 assertions cover shared-descriptor
  sets, unique descriptors, return-type discrimination, arity, arrays, void set membership,
  substrate consistency, malformed angles, unregistered types, and live post-dispatch stability.
