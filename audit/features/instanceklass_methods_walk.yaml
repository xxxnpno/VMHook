known_bugs:
  - severity: high
    note: "Array<Method*> data offset hardcoded to +8 in get_methods_ptr and length read at +0 as a raw int32 in get_methods_count — no VMStruct backs the Array<T> internal layout. Correct on every shipping LP64 HotSpot but an unchecked ABI assumption; a 32-bit VM / future layout change reads one slot early and the whole enumeration is garbage Method*s. The per-slot is_valid_pointer skip usually degrades this to a wrong/short list rather than an AV."
  - severity: medium
    note: "_length read as a signed int32 and only lower-bounded (callers guard count<=0). A large positive garbage length (only reachable if the +8 layout assumption is already wrong) passes the guard and drives a huge reserve()/loop with no ceiling (HotSpot caps at 65535 methods/class) — effectively a hang or swallowed bad_alloc."
  - severity: medium
    note: "Silent divergence between collect_klass_methods and its ~10 inline clones (hook<T> target lookup, deoptimize_methods_if, static_method()->call() overload re-selection, and the get_methods_count+get_methods_ptr index loops at vmhook.hpp:17613/17951/18016/18086/18149/18950). Currently consistent, but any future validation fix must be applied to all of them or hook<T> could resolve a Method* that get_class_methods would skip. Latent-bug factory."
  - severity: medium
    note: "_methods lists DECLARED methods only, never inherited — invisible at the API. get_class_methods('java/lang/Integer') omits equals/hashCode. The only super-walking path is static_method()->call() overload re-selection."
  - severity: low
    note: "The per-slot is_valid_pointer sentinel filter can drop a legitimate Method* whose low 32 bits equal a debug sentinel (0xCAFEBABE/0xDEADBEEF). Astronomically rare, non-deterministic across runs (ASLR) — a true false-negative path."
notes: |
  No VMStruct backs the Array<T> internal layout (length +0, data +8); the
  InstanceKlass::_methods VMStruct entry itself is present and version-robust
  across JDK 8-26. Synthetic-method counts vary by javac/JDK (JDK 8 access$NNN
  accessors vs JDK 11+ nestmates), so hard-assert named-method membership and
  lower bounds, RECORD total counts. enum synthetics (values/valueOf) are stable
  JDK 8-26. Symbol bodies are modified UTF-8; the symbol::to_string length clamp
  (>0x1000 -> empty) never fires for real method names. The walk is index-ordered
  over _methods so element order is stable within a run.
