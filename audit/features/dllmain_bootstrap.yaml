title: Dllmain Bootstrap
category: bootstrap
status: in_progress
risk: high
specialist: .claude/agents/dllmain_bootstrap-specialist.md
description: |
  The platform entry-point glue responsible for spawning the modular test-suite worker thread
  exactly once when the vmhook DLL/`.so` is loaded into a live JVM (via `DllMain` on Windows
  or ELF constructor / `JNI_OnLoad` on POSIX). Its I/O contract: one platform entry point
  → exactly one detached worker thread → `run_test_suite()` → all modular JVM test modules.
  The bootstrap waits a fixed 2 seconds for JVM readiness, registers thirteen baseline wrapper
  classes, then hands off to the modular harness; if readiness fails or worker spawns twice,
  the entire test suite is silently skipped or the loader deadlocks.
