known_bugs:
  - severity: high
    note: "caller() (vmhook.hpp:9551) is NOT hardened against the stray-pointer AV that stack_trace() explicitly defends against — it lacks both the monotonic/<=1MiB saved-rbp distance guard and the up-front ConstMethod/ConstantPool chain validation that stack_trace() (9674) carries, then calls caller_method->get_name()/get_signature() with only an is_valid_pointer gate. A hook whose immediate caller is a compiled/native frame (common once the call site JITs) can land [caller_rbp-24] on a bogus Method* and AV inside get_name(). Fix: route caller() through the shared stack_trace guards / stack_trace(1).front()."
  - severity: medium
    note: "locals_offset is a single process-global, last-writer-wins (decl vmhook.hpp:5633, written by find_hook_location at 5725). find_hook_location overwrites it on every i2i-stub scan; two stubs with different mov r14,[rbp+disp] displacements make the second offset apply to both, silently mis-reading the first method's locals. A failed pattern match leaves the stale/-56 default."
  - severity: medium
    note: "get_locals() JDK-era heuristic (vmhook.hpp:6074) has an unguarded middle band: a JDK-21+ frame whose recovered index is >= 0x1000 (a method with >4096 locals-worth of frame span — legal, max_locals is u2 up to 65535) silently yields nullptr, making every typed-arg decode return defaults with no diagnostic. The 0x1000 boundary is unrelated to the real 0xFFFF max_locals bound."
  - severity: medium
    note: "The bits <= 0xFFFFFFFF narrow-oop heuristic (shared by extract_frame_arg, get_argument, get_arguments) is ambiguous with compressed oops disabled (-XX:-UseCompressedOops / large heaps): a genuine uncompressed heap pointer below 4 GiB is wrongly decode_oop_pointer'd, corrupting the decoded self/String/wrapper. Silent either way."
  - severity: low
    note: "Slot-model J/D two-slot rule duplicated across six sites (java_slot_offsets::compute, get_arguments inline, get_argument, extract_frame_arg, set_arg, descriptor parser). Agree today, latent regression surface."
  - severity: low
    note: "float and bool ride the generic sizeof<=4 primitive path (in get_argument and extract_frame_arg) with no sign/width normalisation; a non-canonical slot byte would surface as a bool with non-{0,1} representation. Edge case, not a confirmed bug."
notes: |
  Method* offset -24, locals_offset back-scan, and the saved-rbp walks are the
  x64 interpreter constants (interpreter_frame_method_offset = -3 words); stable
  across HotSpot x64 JDK 8-26 but architecture/ABI-specific. The locals encoding
  flips at JDK 21 (direct pointer 8-20 vs spilled index (r14-rbp)>>3 on 21+),
  detected by the is_valid_pointer-vs-<0x1000 heuristic. The typed hook<T>
  callback path is sound (bounds-guarded, null-guarded, static_assert on
  unsupported types); the hazards bite the raw/manual path (ret.frame() ->
  get_locals()/get_argument by hand) and the caller() convenience. No-JVM
  coverage is in test_interpreter_frame_walk.cpp (saved-rbp guard contract) +
  test_traits[_extra].cpp (compile-time slot model) + test_helpers.cpp (no-frame
  contract); live-JVM coverage in return_frame_raw_access.cpp (slot model,
  set_arg round-trip) + return_stack_trace_depth.cpp (multi-frame walk).
