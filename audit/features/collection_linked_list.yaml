known_bugs:
  - severity: high
    note: "Entire walk hard-codes narrow (32-bit) OOP reads (15199-15202, 15220-15236) and narrow klass at oop+8 (14603-14604); under -XX:-UseCompressedOops/-XX:-UseCompressedClassPointers (heap > ~32 GB default), reads pick up half-pointers yielding garbage/wild addresses with no diagnostic."
  - severity: medium
    note: "No cycle/length-overrun detection; chain LONGER than size silently truncated (15205-15207); unsynchronised size read (14840) vs walk can miss elements if list mutated between reads."
  - severity: medium
    note: "Empty vector indistinguishable from decode failure (14809-14812, 14841); genuinely empty LinkedList and read error both return {} with no API signal."
  - severity: medium
    note: "find_field never memoizes misses (11025-11045); elementData absence probe re-scans full super chain on every LinkedList read, defeating the field cache (pure perf defect)."
  - severity: low
    note: "Per-node re-resolution of item/next redundant despite doc comment claiming cached offsets (15214-15215 calls find_field every iteration; comment at 15176-15178 overstates optimisation)."
  - severity: low
    note: "read_java_string silently returns empty string for decoded length 0 or > 4096 (15763-15769); empty/corrupt element indistinguishable, >4096-char element silently dropped."
notes: |
  Field names (`first`, `size`, `elementData`, `item`, `next`) stable across JDK 8–25.
  Compressed oops assumption (flaw #1) is global vmhook; LinkedList has zero fallback.
  Element decode via read_java_string branches JDK8 char[] vs JDK9+ coder byte[]
  (15772); fixture uses short ASCII but real long/empty strings mis-read silently.
  Test covers three independent paths (value_t/wrapper/free-function) converging on
  same 3 ordered elements to prove branch selection and chain walk both correct.
