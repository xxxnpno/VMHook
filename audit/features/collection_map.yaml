known_bugs:
  - severity: high
    note: "Entire feature silently returns empty under -XX:-UseCompressedOops (heaps >32GB). All reference loads are hardcoded 4-byte narrow oops (15700, 15266-15268, 15431-15433, 15301-15309, 15323-15325, 15463-15466, 15510-15512, 14603-14604); decode_oop_pointer returns nullptr when CompressedOops VMStruct entries absent (4342-4345); no 8-byte fallback."
  - severity: medium
    note: "read_java_string and array_length bake in compressed-oops header offsets (+12 for _length, +16 for data, 15762/15771/11542-11551); with compression off, klass is 8 bytes and lengths move to +16/+20 — keys and bucket indices misread."
  - severity: medium
    note: "Fast-path selection is purely name-based (get_field_by_oop_klass('table') shadows 'root', 15127 vs 15134); HashMap wins ties; a third-party Map with 'table' field that is not HashMap.Node[] is mis-walked (15296-15299 bails to empty silently)."
  - severity: low
    note: "value_t::to_entries reads field oop with no type/signature check (15700); blindly reinterprets as narrow oop; primitive-typed field would be decoded as oop and fed to klass_from_oop; downstream guard (no table/root → empty) catches non-Map, but defense-by-luck not by signature gate."
notes: |
  **Compressed oops assumption (dominant sensitivity).** Feature only works with
  -XX:+UseCompressedOops (the default below ~32GB heap on JDK 8..25). Disable it or cross
  32GB and flaws #1/#2 make every map decode empty. CI matrix runs the default, masking the
  limitation.
  **String layout 8 vs 9+.** read_java_string branches on presence of coder field: JDK8 has
  UTF-16 char[] value (no coder); JDK9+ has byte[]+coder LATIN1/UTF16. Keys in fixture are
  pure ASCII so both paths decode identically.
  **Node/TreeNode field stability.** HashMap.Node and HashMap.TreeNode expose key/value/next
  since Java 8; TreeMap.Entry (key/value/left/right/parent/color) stable since Java 1.2.
  A JDK renaming any field silently breaks the walk (find_field returns nullopt, chain bails
  to empty, 15296-15299 / 15484-15487) rather than crashing.
