schema_version: 1
slug: method_enumeration
title: Method Enumeration
category: method
status: seeded
risk: high
specialist: .claude/agents/method_enumeration-specialist.md
description: |
  Reading a class's `InstanceKlass::_methods` array directly (no JNI/JVMTI) into
  `(name, JVM-descriptor)` pairs, selecting methods by descriptor when the name
  rotates per obfuscated build, and installing a hook on the UNIQUE descriptor
  match while REFUSING an ambiguous one. The four public entry points are
  `get_class_methods<T>()`, `get_class_methods("internal/Name")`,
  `find_methods_by_signature<T>(desc)` (exact string-equality, returns ALL
  matches so the caller can detect non-uniqueness), and
  `hook_by_signature<T>(desc, detour)` (returns false on no-match OR on > 1 match,
  else delegates to `hook<T>`). All sit on `detail::collect_klass_methods` (the
  shared, noexcept, try/catch-wrapped engine that walks the array skipping
  is_valid_pointer-failing slots). Enumeration is DECLARED-only; works on classes
  never `register_class<T>()`'d (the discovery path for obfuscated builds).
java_versions:
- 8
- 11
- 17
- 21
- 24
- 25
- 26
tags: [method, enumeration, descriptor, hook-by-signature, obfuscation, declared-only, no-jvm]
hpp_anchors:
  - symbol: detail::collect_klass_methods
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8804, 8835]
    note: "shared engine: noexcept, snapshots count+ptr once, skips is_valid_pointer-failing slots, emplaces get_name()/get_signature(), outer try/catch"
  - symbol: vmhook::get_class_methods / find_methods_by_signature
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8853, 8930]
    note: "by-name (8853), by-wrapper (8873), find_methods_by_signature exact-equality filter (8913) returning ALL matches"
  - symbol: vmhook::hook_by_signature
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [11214, 11260]
    note: "resolves names via find_methods_by_signature; false if names.empty() (no-match) OR names.size() > 1 (ambiguous), else hook<T>(names.front(), descriptor, detour)"
  - symbol: klass::get_methods_count / get_methods_ptr (the substrate)
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3498, 3580]
    note: "Array<Method*>::_length at +0 (3498), data at hardcoded x64 +8 (3537) — the real ABI risk under this feature"
