known_bugs:
  - severity: high
    note: "Field-stream constant-pool reads (klass::find_field_in_stream JDK 21+ and Array<u2> path JDK 8–17) have NO _length bound and NO per-slot is_readable_pointer check — asymmetric with const_method::get_name/get_signature bounded path. Indices decoded from heap metadata (UNSIGNED5 / u2 array) can be corrupted/mis-decoded; dereference base[idx] without guards at 2975, 2982 (stream), 3094, 3114 (Array). Access violation not recoverable nullptr. Fix: shared bounded accessor mirroring method-path guards."
  - severity: high
    note: "Array<u2> signature read entirely unguarded (vmhook.hpp:3114) — constant_pool_base[sig_index] loaded with NO preceding (if sig_index && is_valid_pointer(...)) unlike name read at 3094. Only is_valid_pointer on result. Field with signature_index==0 or out-of-range still dereferenced. Most reachable variant of flaw #1 on JDK 8."
  - severity: medium
    note: "get_length() returns raw int32 with no sanity ceiling; garbage _length (e.g. 0x40000000) passes cp_length >= 0 check, silently disabling bound for all real uint16 indices. Negative _length also disables bound. Bound only trustworthy when _length itself trustworthy. Field-stream indices are uint32 (not uint16), so decode_u5 result in (real_length, 0x7fffffff] bypasses bound entirely."
  - severity: medium
    note: "get_base() does not validate this pointer (unlike get_length at 1975 and get_name/get_signature at call site). Caller handing bogus constant_pool* to get_base() gets bogus-but-non-null base; downstream is_valid_pointer(base) only checks pointer value, not whether base (this+size) points at committed array. Header-size addition can push near-ceiling this past user_address_ceiling."
  - severity: low
    note: "get_length() reads _length field without is_readable_pointer (line 1979 only guards with is_valid_pointer at 1975). Possible fault on ConstantPool* range-valid yet pointing into decommitted/guard page during class unload or GC churn. Minor because method-path callers already passed cp through is_valid_pointer, but unguarded raw read on HotSpot-lifetime object."
  - severity: low
    note: "1-based-index contract undocumented at read sites and not asserted. Base is 1-based (doc 1934) but get_name/get_signature accept index==0 (only index >= cp_length rejected); base[0] read relies on is_valid_pointer usually failing. Field-stream paths DO special-case name_index==0 (2947, 2975, 3089), enforcing contract inconsistently across two paths."
notes: |
  JDK-version sensitivities: ConstantPool header size (get_base, line 1943) is read
  per-JDK from gHotSpotVMTypes and adapts across JDK 8–26, but no cross-check if
  type is exported with truncated size. ConstantPool::_length availability governs
  bound effectiveness — when absent (drops on some future JDK), get_length() returns
  -1 and method-path bound disables, leaving only is_readable_pointer. Field metadata
  layout diverges: JDK 8–20 use InstanceKlass._fields (Array<u2> 6-slot, cp reads
  at 3094/3114); JDK 21.0.x+ / 22+ use _fieldinfo_stream (Array<u1> UNSIGNED5, cp
  reads at 2975/2982). Both feed unbounded cp indices, so out-of-range exposure has
  two triggers. _pool_holder is exported on every tested JDK (used at 7674/12687/13827)
  but raw-offset read assumes it sits at VMStruct offset; field drop → class-name
  lookup skipped, not crash. Compressed-class pointers do not change entry width
  (Symbol* is native, not narrow); compressed oops irrelevant (cp entries are metadata).
