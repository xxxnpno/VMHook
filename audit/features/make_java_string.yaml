known_bugs:
  - severity: medium
    note: "[characterised, was HIGH] GC-survival is environment-variant — the made oop can be relocated/reclaimed by a concurrent/moving GC before Java code observes it. Fixed test-side at commit 79e58be: survive_gc_post_equals_implies_correct_length_* was hard-asserting GC-survival but is now PASS-or-[INFO] (creation correctness stays HARD). Root cause is structural: stores into String.value and into static reference fields go through set_field's plain memcpy (vmhook.hpp:11156 in the field_string overlap window — see field_string.yaml) with NO GC store barrier, so a young GC that doesn't otherwise scan that card can miss the cross-generational reference. Native round-trip (read_java_string immediately after) passes; Java-side equals/length asserted post-GC is fragile."
  - severity: medium
    note: "JDK-8 classic char[] path is documented but produces an invalid/unusable String in practice — vmhook.hpp:14294-14322. The path exists (make_java_array('[C', char_count, 2) at 14296, widening to uint16 at +16 at 14305, optional offset/count writes at 14313-14321), but make_java_string is asserted as 'returns null/invalid on JDK 8' by the test module so every gate that needs a valid made oop is HARD-asserted only on JDK 9+ and recorded SKIPPED on JDK 8. Root cause: arrayOop header geometry (length at +12, data at +16) assumes UseCompressedClassPointers + the compact-String JDK-9+ String layout; JDK-8 String requires offset/count coherent with a shared char[] which this path does not validate against a JNI reference."
  - severity: medium
    note: "Hardcoded compressed-OOP array geometry — vmhook.hpp:14267 (LATIN1 data @ value_array+16), 14289 (UTF16 data @ value_array+16), 14305 (classic char[] data @ +16), with length written to array_oop+12 inside make_java_array. The 16-byte array header (8 mark + 4 compressed-klass + 4 length) is only correct when UseCompressedClassPointers is on. Run with -XX:-UseCompressedClassPointers (or heap > 32 GB widening the klass word to 8 bytes) and the true layout becomes mark(8)+klass(8)+length(4)+pad: length at +16, data at +24. read_java_string uses the SAME wrong constant on the read side, so the native round-trip would still pass and mask the Java-visible corruption."
  - severity: low
    note: "UTF-16 backing bytes written with raw memcpy of host memory — vmhook.hpp:14289-14290. HotSpot StringUTF16 stores chars in platform byte order which is true on the little-endian x64 CI, so this is correct today; but on any big-endian target the bytes would be swapped relative to charAt expectations. Symmetric read_java_string decode also memcpys, so the native round-trip would still pass and hide it."
  - severity: low
    note: "`hash` zeroed but `hashIsZero` (JDK 9+) never set — vmhook.hpp:14324-14327. The hash cache field is stamped to 0 if present; the companion `hashIsZero` boolean introduced on JDK 9+ is not written. Lazy recompute means this is harmless for the strings under test (none hash to 0), but a String whose real hashCode() is genuinely 0 would diverge from the contract a normal String establishes."
  - severity: low
    note: "No String constructor / no interning — by design, but a real semantic gap. The product is a raw heap String never seen by String.<init>: identity differs from any literal (`s == \"hello\"` is false even for content-equal `s`), the JVM string-table dedup doesn't run, and any invariant a constructor would establish is absent. Callers who assume `==` against an interned literal or rely on string dedup will surprise."
notes: |
  Two distinct cross-references with field_string.yaml: (1) field_string's
  4-KiB cap bug is a HARD REJECT in read_java_string (vmhook.hpp:15178,
  length > 4096 -> {}), whereas make_java_string takes the OPPOSITE path
  for over-cap inputs — at 14225 it caps the TLAB fast path at 4096 code
  units but at 14339-14374 falls through to the GC-aware
  JNIEnv::NewString slow path so the resulting String is built in full at
  any length. The round-trip is therefore asymmetric: a String created
  by make_java_string(5000-char input) is content-complete but
  read_java_string on it returns {}. (2) field_string's "UTF-16 effective
  cap is 2048 chars" bug is a read-side symptom that does NOT apply to
  the encode side: make_java_string allocates 2N bytes for an N-codepoint
  UTF16 backing array directly (14280), so encode handles 4096 UTF16
  chars cleanly even when the read-side rejects them at 4098 backing
  bytes. JDK-version sensitivities: compact strings (JEP 254) hinge on
  whether java.lang.String has a `coder` field (14206) — JDK 9+ takes
  one of the two compact paths, JDK 8 takes the classic char[] path
  (whose practical brokenness is itself a known bug above); `offset` and
  `count` are written only if they exist on the klass (14313-14321) to
  cover the JDK 6/7 layout that JDK 8 still partially honors.
  Array geometry assumes UseCompressedClassPointers (data at +16,
  length at +12); CI default x64 satisfies this. The TLAB fast path must
  run on a current Java thread (make_java_object requires
  ensure_current_java_thread); allocation off a Java thread returns null
  and the function falls through to the JNI fallback (which itself
  needs a JNI env). All compressed-OOP slots are stored via
  encode_oop_pointer (14272/14291/14311) which round-trips with
  decode_oop_and_pointers in read_java_string.
