title: Make Java String
category: jni
status: in_progress
risk: medium
specialist: .claude/agents/make_java_string-specialist.md
description: |
  `vmhook::make_java_string(std::string_view utf8)` allocates a brand-new
  `java.lang.String` heap oop straight from C++ without `JNIEnv::NewStringUTF`.
  Input contract: caller passes a UTF-8 byte sequence (a `std::string_view`,
  never a JNI handle); the function decodes UTF-8 into UTF-16 code units
  (astral scalars become surrogate pairs, malformed bytes fold to U+FFFD),
  resolves `java/lang/String` via `find_class`, allocates the String
  instance + backing array out of the current thread's TLAB, then stamps
  `value`/`coder`/`hash`/`offset`/`count` by hand. Coder branching: presence
  of a `coder` field selects compact strings (JDK 9+) vs classic char[]
  (JDK 8); on the compact path a content scan picks LATIN1 (`coder=0`,
  byte[] of length N) when every unit <= 0xFF, otherwise UTF16 (`coder=1`,
  byte[] of length 2N, native-endian); on JDK 8 it falls back to `[C` with
  optional `offset=0`/`count=N`. Inputs longer than 4096 code units bypass
  the TLAB path entirely and fall through to the GC-aware
  `JNIEnv::NewString` fallback so they are NOT truncated. Output: a raw
  heap oop usable as a `String` (not a JNI local ref). Must run on a Java
  thread (`make_java_object` requires `ensure_current_java_thread()`).
