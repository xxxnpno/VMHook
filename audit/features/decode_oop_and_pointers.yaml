known_bugs:
  - severity: low
    note: "Doc-comment undercounting poison set (1760-1761 lists 6, but switch at 1791-1799 rejects 9 including 0xABABABAB, 0xFDFDFDFD, 0xDDDDDDDD) — misleads maintainers on poison filter coverage."
  - severity: medium
    note: "Alignment inconsistency across validators (is_valid_pointer 2-byte @ 1780, safe_read_pointer 8-byte @ 1850, is_readable_pointer 8-byte @ 1746) — addresses passing is_valid_pointer silently drop in safe_read_pointer."
  - severity: medium
    note: "Null-oop codec collision under non-zero base (decode(0)->nullptr @ 4291, encode(nullptr)->0 @ 4363, encode(base)->0 too; both null and object-at-base round-trip to 0; a decoded < base clamps to 0 @ 4418-4421 rather than flagging)."
  - severity: medium
    note: "Unguarded 32-bit deref in read_pointer<T> @ 1827 — no null/range check on base+offset, faults hard if base is stale, no exception catch (noexcept)."
  - severity: low
    note: "Blind untag_pointer masking @ 1813-1818 — AND any input with no null/validity contract; kernel/non-canonical addresses silently mask into canonical range and pass is_valid_pointer downstream."
  - severity: low
    note: "iOS safe_read unguarded memcpy @ 919-924 — std::memcpy and return true unconditionally, not fault-safe on target (documented known limitation but 'safe' contract does not hold)."
notes: |
  JDK-version sensitivities drive the 3-way narrow-oop VMStruct fallback in codec functions (4300-4340 / 4368-4408):
  JDK 8-16 export Universe::_narrow_oop._base/_shift; JDK 17-24 moved to CompressedOops::_narrow_oop._base/_shift;
  JDK 25+ dropped _narrow_oop prefix to CompressedOops::_base/_shift. Narrow-oop shift is typically 0 (small heaps) or 3 (heaps up to ~32 GB);
  above ~32 GB compressed oops disabled entirely. Constants (floor 0xFFFF, ceiling 0x00007FFFFFFFFFFF) assume 48-bit x86-64 canonical split,
  architecture-sensitive on 5-level-paging / AArch64. Platform safe_read divergence: Windows/Linux/Android/macOS fault-safe; iOS not (flaw #6).
