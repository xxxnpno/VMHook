known_bugs:
  - severity: high
    note: "set_dont_inline dereferences Method* without null or validity check (7474-7535 entry); every other Method accessor guards with is_valid_pointer, but set_dont_inline does not. On JVMTI RedefineClasses between install and shutdown, Method* aliases freed memory; set_dont_inline fetches _flags from alien object and writes garbage, causing AV on Windows or silent corruption on Linux. suggest_fix: add is_valid_pointer guard at top of function."
  - severity: high
    note: "get_flags() hard-codes uint16_t width (2843-2908) yet Method::_flags is u1 on JDK 8-12 and u4 on JDK 21+; OR/AND on JDK 8 u1 overwrites the adjacent byte (_intrinsic_id/_jfr_towrite depending on layout), silently corrupting unrelated fields. JDK 21+ u4 fields are partially updated. suggest_fix: dispatch on type_string (u1/u2/u4) and use width-aware read-modify-write per field width."
  - severity: high
    note: "_flags read-modify-write is non-atomic (7474-7535, specifically atomic_ref fetch_or/fetch_and missing); HotSpot JIT threads concurrently write _flags with Atomic::cmpxchg. Non-atomic OR/AND races with JIT CAS and loses bits. Worst case on JDK 21+ u4 _flags: we clear _changes_current_thread/_jvmci_alias bits and trigger stale JIT deopt/barrier logic. suggest_fix: use std::atomic_ref<uintN_t>::fetch_or/fetch_and with memory_order_acq_rel."
  - severity: high
    note: "set_dont_inline silent failure on VMStructs lookup (2843-2908) — when iterate_struct_entries returns nullptr (JVM not loaded / mismatched build), get_flags() returns nullptr and set_dont_inline quietly no-ops with no log. Install succeeds (only checks access_flags not _flags), hook fires interpreted, silently dies when JIT inlines any caller, no diagnostic. suggest_fix: wrap lookup in try/catch, log via VMHOOK_LOG with error_tag, have hook<T>() fail or warn on outcome."
  - severity: medium
    note: "Hard-coded bit position (1 << 2) never consults Method::_dont_inline VMTypes constant (7474-7535); HotSpot exports enum values via gHotSpotVMIntConstants (pattern Method::_dont_inline) reachable through VMStructs. When JDK reorders enum (IBM Semeru OMR build observed), set_dont_inline silently sets WRONG bit (_force_inline/_caller_sensitive) and JIT inlines hook callee. suggest_fix: one-time lookup of Method::_dont_inline constant with fallback to (1<<2)."
  - severity: medium
    note: "NO_COMPILE includes JVM_ACC_QUEUED (0x01000000) without justification (7409-7413); QUEUED signals 'sitting in compile queue' and blocks re-enqueueing. Bit left set forever; if HotSpot sees QUEUED without matching CompileBroker entry (mid-shutdown), emits 'compile queue inconsistent' warnings. suggest_fix: document why QUEUED is needed (CompileBroker fast-path on is_queued() in JDK 12+) or drop it and rely on NOT_*_COMPILABLE alone."
  - severity: low
    note: "Pre-install Method-flag mutations (set_dont_inline + NO_COMPILE at 10128/10135 in hook<T>()) leak on exception before midi2i_hook/common_detour install completes (no rollback); asymmetric with hook_handle::stop() cleanup. If install fails mid-sequence, flags stay set on a method with no detour installed."
notes: |
  JDK 8-12 and JDK 21+ have different Method::_flags widths (u1 vs u4). The
  test module uses best-effort readback of _dont_inline bit only when observable
  on the running JDK (dont_inline_observable() gate); all other assertions
  (NO_COMPILE set, idempotency, teardown clearing) are hard assertions on every
  version. The VM-walk safe_read/safe_write paths (vmhook.hpp lines 2754-2840)
  and method-validity guards introduced post-v0.5.0 defend against cold Method*
  pages during verify_hooks repair cycles, but the initial install path (10128-10135)
  still lacks guards. Fault-safe conversion of this path is pending.
