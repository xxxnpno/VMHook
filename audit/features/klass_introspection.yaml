    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2018, 2055]
    note: "Gate behind every klass/method/symbol deref — range, alignment, and nine debug-fill sentinel checks"
  - symbol: "vmhook::hotspot::klass::get_name"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3404, 3431]
    note: "Reads Klass._name via safe_read_pointer + untag_pointer (strips GC tag bits); returns symbol* or nullptr"
  - symbol: "vmhook::hotspot::klass::get_super"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3700, 3712]
    note: "Reads Klass._super; JDK-variant for ArrayKlass/TypeArrayKlass — gated to [INFO] in shapes test at 14413f1"
  - symbol: "vmhook::hotspot::klass::get_instance_size"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3729, 3747]
    note: "Reads Klass._layout_helper; negative value indicates array/interface klass (not instantiable)"
  - symbol: "vmhook::hotspot::klass::get_methods_count / get_methods_ptr"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3469, 3530]
    note: "InstanceKlass._methods Array<Method*>: _length at +0, data at +8 (x64-specific pad); count clamped [0,65535]"
  - symbol: "vmhook::hotspot::klass::find_field / find_field_in_stream"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [3962, 4069]
    note: "JDK dispatch: _fieldinfo_stream (JDK 21+, UNSIGNED5) or _fields Array<u2> (JDK 8-20, 6 slots/field)"
  - symbol: "vmhook::klass_from_oop"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [18738, 18774]
    note: "Decodes narrow klass from OOP+8 via decode_klass_pointer; Windows-gates the header read through safe_read"
