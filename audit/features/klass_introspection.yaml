known_bugs:
  - severity: medium
    note: "No klass-kind check before reading InstanceKlass._methods layout (get_methods_count 3469 / get_methods_ptr 3508). find_class('[I') or any array descriptor resolves an ArrayKlass, not an InstanceKlass; the cached _methods offset then reads a field that does not exist on that layout. Currently saved by downstream is_valid_pointer(array)+count<=0 bailouts, but a future JDK whose ArrayKlass holds a valid-looking pointer at that offset would silently walk garbage as a method array. Fix: gate on _layout_helper <= 0 before touching _methods."
    ref: "audit/LIBRARY_BUGS.md"
  - severity: medium
    note: "Array<Method*>::_length trusted as an unbounded reserve/loop bound (get_methods_count 3492). Negatives are filtered but a corrupt large-positive count drove reserve(size_t(count)) (huge alloc caught by outer catch -> silent empty) and indexed methods_array[0..count) past the real array end. Partially mitigated by the [0,65535] clamp added in the same function; verify the clamp is present before the reserve on all callers."
    ref: "audit/LIBRARY_BUGS.md"
  - severity: low
    note: "get_super() JDK-variant for ArrayKlass / TypeArrayKlass (klass.get_super 3700). The _super read on ObjArrayKlass/TypeArrayKlass yields JDK/config-dependent results rather than a guaranteed 'java/lang/Object' pointer. Tests in klass_introspection_shapes were hard-asserting this equality and broke on JDK 17+ / windows; gated to [INFO] at commit 14413f1. InstanceKlass._super is reliable; array-klass _super is not."
  - severity: low
    note: "Symbol length cap in to_string (reached via get_name / method name/descriptor decode): symbols with _length > 0x1000 (4096) decode to ''. An accessor that calls get_name() on a klass or method with an unusually long symbol silently receives nullptr->nullptr->'' rather than the real name. The JVM legal name limit is u2 (65535), so obfuscated/synthetic names in (4096,65535] are silently lost."
    ref: "audit/LIBRARY_BUGS.md"
  - severity: low
    note: "UNSIGNED5 stream over-read within a single field record (find_field_in_stream 3850 / decode_u5 3813). The per-field loop guard checks stream_pos < length only at iteration start; up to 5+3 decode_u5 calls inside a single iteration advance stream_pos with no per-call bound. A truncated/malformed Array<u1> stream can read bytes past the logical array end (within the is_valid_pointer page envelope, no AV). Bound each decode_u5 call against length."
    ref: "audit/LIBRARY_BUGS.md"
notes: |
  JDK layout differences that affect this feature:

  _java_mirror changed from a plain `oop` (JDK 8-16) to an OopHandle (JDK 17+).
  get_java_mirror() detects this at runtime via entry->type_string and performs one
  extra level of indirection for OopHandle.  Hardcoding the JDK version would break
  on patched builds; the type_string check is the correct approach.

  Field storage format split: JDK 8 through early JDK 21 use InstanceKlass._fields
  (Array<u2>, 6 slots per field, data at +4, offset reconstructed via >>2).  JDK 21.0.x+
  and JDK 22+ export _fieldinfo_stream (Array<u1>, UNSIGNED5 compressed).  find_field()
  dispatches on which VMStruct entry is present; a JDK exporting neither degrades to
  nullopt.  Array<u2> also carries a trailing _java_fields_count u2 on JDK 8 — handled
  by integer-division loop bound.

  Array<Method*> data offset +8 (get_methods_ptr 3529) is x64-specific: 4-byte _length
  at +0, 4 bytes alignment padding at +4, 8-byte-aligned Method* _data[0] at +8.  A 32-bit
  or differently-aligned build would need a different constant.  On all 64-bit HotSpot
  8-26 builds this is stable.

  Klass._name can carry GC tag bits (stripped via untag_pointer in get_name 3422).  This
  makes the name read GC-robust across all collectors including ZGC.

  The array-klass get_super() defect (commit 14413f1): ObjArrayKlass and TypeArrayKlass
  _super reads are JDK/config-variant — deterministically failing on JDK 17+ in CI
  when asserted as hard checks in klass_introspection_shapes.  InstanceKlass._super
  is reliable.  The shapes test now [INFO]-characterizes array-klass super reads rather
  than hard-asserting them.

  klass_from_oop on Windows gates the OOP+8 narrow-klass header read through
  os::safe_read (ReadProcessMemory) to avoid uncontained faults on no-SEH toolchains
  (MinGW / clang-on-windows).  POSIX keeps the raw read because the JVM's signal
  handler contains stray AVs there and gating regressed other oop-walk paths.
