known_bugs:
  - severity: medium
    note: "No klass-kind check before reading the InstanceKlass _methods layout: find_class('[I')/'[Ljava/lang/String;' resolves an ArrayKlass, then get_methods_count/get_methods_ptr apply the cached InstanceKlass._methods offset to a structurally different object. Saved only by the downstream is_valid_pointer + count<=0 bailouts (usually returns empty), but it reads a field that does not exist on that klass kind. Fix: gate on Klass._layout_helper / oop_is_instance before touching _methods."
  - severity: medium
    note: "_length trusted as an unbounded loop/reserve bound: method_count is the raw int32 read; negatives are filtered (count<=0) but a corrupt large-positive length drives reserve(count) (huge alloc / length_error, caught by the outer catch -> silent empty) and a loop over methods_array[0..count). Only the per-element is_valid_pointer prevents dereferencing the bogus tail. Fix: clamp count to a sane ceiling."
  - severity: low
    note: "Silent name/descriptor loss on an over-long symbol: symbol::to_string yields \"\" for _length > 0x1000, and collect_klass_methods then emplaces a (\"\",\"\") pair rather than skipping the slot. The JVM legal limit is 65535 (u2), so reachable in principle (obfuscators, synthetic lambda names); fixtures use short symbols so untested."
  - severity: low
    note: "Asymmetric exception handling between the two non-template overloads: get_class_methods<T>() wraps its body in try/catch but get_class_methods(string_view) does not — it is noexcept yet relies on callees never throwing. If a future find_class edit throws past its own catch, the by-name overload std::terminates while the by-type overload degrades to empty."
  - severity: low
    note: "UNSIGNED5 stream over-read within a record (fields leg): find_field_in_stream checks stream_pos < length only at the top of each field iteration; inside one iteration it issues up to 5+3 decode_u5 calls with no per-call bound check, so a truncated/malformed stream reads a few bytes past the logical Array<u1> end. Inside the is_valid_pointer page envelope (no AV) but reads bytes not part of the array. Fix: bound every decode_u5 against length."
notes: |
  The code is heavily defended (null/validity gate on every deref + outer
  try/catch), so there is no AV-grade crash on a loaded InstanceKlass; the
  defects are type-safety / silent-degradation hazards. Array<Method*> data
  offset +8 is x64-specific (4-byte _length + 4-byte pad + 8-byte-aligned
  pointers). The fields-format split is the JDK-sensitive leg: JDK 8-~20
  InstanceKlass._fields (Array<u2>, 6 slots/field, data at +4, packed-offset
  >>2) vs JDK 21.0.x+/22+ _fieldinfo_stream (Array<u1>, UNSIGNED5), selected
  purely by which VMStruct gHotSpotVMStructs exports (neither -> std::nullopt).
  _methods is stable across 8-26 (an Array<Method*> throughout), so the method
  leg is far less JDK-sensitive than the field leg; the only method-side variance
  is the synthetic-method set javac emits (JDK 8 extra synthetics), so tests
  assert SET membership + LOWER bounds, never an exact total. Klass._name can
  carry GC tag bits (stripped via untag_pointer). The no-JVM contract (every entry
  point empty without throwing) is pinned by tests/test_method_enumeration.cpp.
