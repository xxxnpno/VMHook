known_bugs:
  - severity: high
    note: "Array-klass walk hazard at line 8178-8180 / 7636-7639: for_each_loaded_class yields array klasses (non-InstanceKlass), safe_klass_methods rejects them by design (returns false at 7674-7675 on non-InstanceKlass). Risk is a cold/mid-GC-relocation array klass passes is_valid_pointer but faults on raw _methods read — mitigated by safe_read_pointer at 7671-7673 + try/catch at 8107, but MinGW has NO SEH (seh_invoke gated at runtime) so uncontained AV crashes JVM mid-suite."
  - severity: medium
    note: "Double-sweep idempotence: deoptimize_methods_if called twice back-to-back on the same live-compiled method with no intervening recompile — the second call reads _code == nullptr (line 8243-8244) and skips it (continue at 8247), so no crash, but semantics are a no-op on the second call (healthy JVM behavior proved in module tests)."
  - severity: medium
    note: "Predicate edge case at line 8249: if predicate throws an exception (not noexcept), the sweep propagates it and may leave methods in a half-deoptimized state (some methods had _code cleared, some did not). The function signature does not enforce noexcept on the predicate, only on the function itself (line 8171)."
notes: |
  JDK sensitivity: _adapter field is exported via VMStructs on JDK 8 only (line 8206-8207 iterates it).
  On JDK 9+ the field is absent, so the sweep falls back to get_adapter() heuristic at line 8273 — this is safe because
  _code proved the Method's page is mapped beforehand (line 8242-8244). The heuristic scan (in-object, memcpy-bounded)
  stays on the committed Method allocation and cannot fault. Array klasses (type arrays, object arrays) are deliberately
  rejected by safe_klass_methods and never walked past line 7674; cold klasses that are mid-GC-relocation are the primary
  crash-hazard if any read dereferences the raw klass/Method/array without safe_read_pointer or is_valid_pointer gates.
