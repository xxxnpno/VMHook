known_bugs:
  - severity: medium
    note: "Z (bool) get() at vmhook.hpp:11998-12000 — memcpy non-canonical backing byte (anything other than 0x00/0x01) into bool, creating trap representation. Every subsequent static_cast<bool> / std::get<bool> is UB. Test deliberately covers only canonical 0x00/0x01 (lines 122-135). Robust fix would normalize via 'value = (raw != 0)'."
  - severity: low
    note: "Divergent is_reference() semantics at vmhook.hpp:11931-11934 vs 12245-12254 — value_t::is_reference() answers from variant alternative (holds_alternative<uint32_t>), while field_proxy::is_reference() answers from descriptor (front()=='L'||'['). Null-pointer proxy of reference field disagrees: value.is_reference()==false while proxy.is_reference()==true. Correctness trap but not memory-unsafe. Test never cross-checks the two."
  - severity: low
    note: "Cross-alternative numeric narrowing at vmhook.hpp:11862-11865 — static_cast<target_type>(value) silently truncates on implicit conversion. int64 MAX → int32, double → int, negative signed → unsigned wraps (test pins B(-1) → uint32==0xFFFFFFFF, lines 169-173). By design but undocumented at value_t level; not fixable without breaking implicit-conversion ergonomics."
  - severity: low
    note: "Positional brace-aggregate initialization at vmhook.hpp throughout get() (value_t{value, sig}) is fragile against struct/variant reordering — no explicit constructor to localize the index contract. Adding any member before data or reordering variant alternatives silently repoints both the index (hard-coded as 0..8 in test lines 38-49) and every call site. Latent maintenance hazard, not a live bug."
notes: |
  Compressed-OOP decode VMStruct names evolve per JDK: 8-16 use `Universe::_narrow_oop._base/_shift`;
  17-24 use `CompressedOops::_narrow_oop._base/_shift`; 25+ use `CompressedOops::_base/_shift` (no `_narrow_oop.`).
  Every non-zero OOP conversion depends on resolving one of these — a JDK match failure returns nullptr silently.
  The zero-OOP path (pure-logic test) is version-independent. Compact Strings (JDK 9+, JEP 254) means `as_string()`
  and `to_vector()` must test both LATIN1 (coder=0) and UTF16 (coder=1) backing to catch encoding regressions.
  Compressed OOPs only active under ~32 GB heaps; `-XX:-UseCompressedOops` truncates every reference field
  to 4 bytes (garbage on 64-bit). Char array data offset constant (12 bytes) assumes 32-bit compressed-header layout.
