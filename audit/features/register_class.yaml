known_bugs:
  - severity: medium
    note: "type_to_class_map uses insert_or_assign (last-wins, line 8738) while g_type_factory_map uses emplace (first-wins, line 8746). Registering a second, different wrapper type to an already-registered class name re-points the type map (new type -> name) but leaves the factory map pointing at the FIRST type's constructor. A hook callback that takes std::unique_ptr<SecondWrapper> then decodes via the old factory (new FirstWrapper{oop}) and extract_frame_arg static_cast<SecondWrapper*>s the result — an invalid downcast, UB on every subsequent field/method access."
  - severity: low
    note: "Re-registering the SAME type to a DIFFERENT class name via insert_or_assign (line 8738) re-points type_to_class_map but leaves the OLD class name's factory entry alive in g_type_factory_map forever (no erase path exists). The old name permanently resolves to a live factory building T, a small per-rebind permanent leak with no diagnostic."
  - severity: low
    note: "registration_mutex (line 8736) guards concurrent WRITES in register_class, but all hot-path readers (extract_frame_arg 9358/9363, jni_signature_for_arg, resolve_klass 18135, get_class_methods 8839, for_each_instance 8526) read both maps lock-free. The documented contract requires all registration to complete before hooks fire, but a lazy-registration path triggered from inside a detour races with sibling detours reading the maps. An unordered_map rehash mid-insert + concurrent find is bucket-level UB."
  - severity: low
    note: "register_class has no null / empty-name fast-reject of its own before calling find_class (line 8719). An empty string_view reaches find_class which does have an empty-name guard (line 7990), so the behaviour is correct today — but the guard is in find_class, not in register_class, making register_class's own contract fragile against future refactors of find_class."
notes: |
  Thread-safety contract: the two maps are process-global inline variables (header-level
  storage).  The lock in register_class (line 8736) protects concurrent calls to
  register_class itself; it does NOT protect the hot-path readers listed above.  All
  registration MUST happen from a single thread before any hook fires.  Lazy registration
  from inside a detour (mentioned in the comment at lines 8730-8735) is explicitly
  contemplated but inherently racy — treat as unsupported unless both maps are additionally
  locked on the read side.

  The factory's raw-pointer return type (type_factory_function_t, line 1641) is intentional:
  returning std::unique_ptr<object_base> would cause libstdc++/libc++ to eagerly instantiate
  ~unique_ptr<object_base> at lambda-parse time when object_base is still an incomplete type.
  Callers receive the raw pointer and immediately wrap it in a unique_ptr where object_base
  is complete (extract_frame_arg line 9370).

  JDK-version sensitivity: register_class itself is JDK-agnostic — it calls find_class and
  does two map writes.  The behaviours it enables are as JDK-sensitive as find_class (which
  has a ClassLoaderDataGraph walk + JNI context-loader fallback) and as klass_introspection
  (which reads VMStruct offsets).  On every supported JDK 8-26, once the target class is
  loaded, find_class resolves it and registration succeeds.

  Note: register_class does NOT pin a JNI global reference to the jclass.  find_class returns
  a raw HotSpot klass* (not a jobject/jclass); the verified_klass pointer is used only to
  confirm the class exists and is then discarded.  The stored value in type_to_class_map is
  the class NAME string, not a klass* or jclass handle.
