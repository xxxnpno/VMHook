# Annotated example manifest — DO NOT load this file as a real feature.
# It exists for reference and is excluded from generate/validate by name.
#
# Copy the shape and rename to <slug>.yaml.

schema_version: 1
slug: example_feature
title: "Example Feature"
category: infra
status: seeded
risk: medium
specialist: .claude/agents/example_feature-specialist.md
description: |
  One-paragraph summary of what this feature does, what its input
  and output contract is, and what makes it surprising.  Aim for
  ~3-5 sentences; a spawned specialist reads this first.
java_versions: [8, 11, 17, 21, 24, 25, 26]
tags: [example, infra]
hpp_anchors:
