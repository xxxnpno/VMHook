    lines: [1234, 1456]
    note: "main entry point"
  - symbol: detail::example_helper
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [1500, 1520]
test_modules:
  - tests/jvm/modules/example_feature.cpp
  - tests/test_example_feature.cpp
depends_on:
  - wrapper_pattern
  - vmstructs_offset_resolution
related:
  - some_other_feature
audit_docs:
  - audit/findings/example_feature.md
known_bugs:
  - severity: high
    note: "Race window between install and verify_repair on JDK21+."
    ref: "audit/LIBRARY_BUGS.md#example-1"
