known_bugs:
  - severity: medium
    note: >
      The resolver returns the raw entry but never validates `is_static`; callers
      must hand-pick `->offset` vs `->address` with zero enforcement.  A future JVM
      that flips a field's static-ness, or a new call site that copies the wrong
      idiom, silently reads garbage with no diagnostic.  `is_static` is never read
      at the resolver boundary (vmhook.hpp:1961-1980; struct 1867).
  - severity: low
    note: >
      One-shot nullptr cache in `get_vm_structs` / `get_vm_types` / `get_jvm_module`
      (vmhook.hpp:1882, 1895, 1918): if any code path triggers a lookup before
      jvm.dll is mapped (early injection, lazy LoadLibrary), nullptr is cached
      permanently and all subsequent lookups fail even after the JVM is present.
      No invalidation hook exists.
  - severity: low
    note: >
      Per-lookup O(N) linear scan with no index.  Hot callers wrap results in
      `static const` locals (e.g. vmhook.hpp:2211-2212, 2305, 2336), but several
      fallback-probe paths (vmhook.hpp:4717-4823, 4901, 4945) re-resolve on every
      call inside object-walk and thread-enumeration hot paths.
  - severity: low
    note: >
      Array contents are trusted blindly: the loop guards `entry->type_name` but
      dereferences it as a C string via `strcmp` with no `is_readable_pointer`
      check (vmhook.hpp:1968-1978).  A truncated table (missing zero-terminator
      entry) or a dangling `type_name` pointer walks off the end or faults inside
      `strcmp`.
  - severity: low
    note: >
      No overflow check on `->offset` at the resolver boundary (struct vmhook.hpp:1868).
      A mismatched JVM build can produce a huge offset; the caller computes
      `this + entry->offset` into a wild pointer with no sanity ceiling enforced
      at the one place all callers share.
  - severity: low
    note: >
      Stale JDK path hazard: if the JDK installation directory changes after the
      first module lookup (e.g. jdk-26 renamed to jdk-26.0.1), `get_jvm_module`
      returns nullptr forever for that process lifetime because the cache is
      populated once at static-init time.  This broke build-werror JNI cache
      resolution in CI (see project memory: jvm_buildonly_and_array_super).
  - severity: low
    note: >
      `vm_type_entry_t::is_oop_type_type` (vmhook.hpp:1855) doubles the `_type`
      suffix; the HotSpot field is `isOopType`.  No current caller reads it, but
      the name will mislead the next person who needs OOP-type classification from
      gHotSpotVMTypes.
notes: |
  JDK 8 exports the richest set of fields via gHotSpotVMStructs; successive
  releases progressively drop entries (e.g. `Method._adapter` gone on JDK 9+,
  `oopDesc._mark` renamed to `_markWord` around JDK 9, `InstanceKlass._fields`
  replaced by `_fieldinfo_stream` on JDK 16+).  The resolver's nullptr-on-miss
  contract is what makes JDK-variant fallback probes work throughout the library.

  Static-field entries expose `->address` (absolute pointer) not `->offset`; the
  caller must read the correct member.  The two disciplines are a load-bearing
  convention, not a type-system guarantee.

  Stale-JDK-path gotcha (per project memory jvm_buildonly_and_array_super): when
  a JDK installation directory is renamed or upgraded (jdk-26 -> jdk-26.0.1) after
  the build system caches the module path, `get_jvm_module` finds nothing and the
  entire offset resolution layer returns nullptr for the process lifetime.  Re-run
  CMake configure to repopulate the cached JVM path.

  The no-JVM test suite (tests/test_iterate_entries_safety.cpp) covers null-head
  safety and argument-guard paths exhaustively but has zero positive-path coverage:
  no test ever feeds a populated table and asserts a correct `->offset` value.
  A synthetic in-memory table fixture with a seam into the walk function is the
  next required test investment.
