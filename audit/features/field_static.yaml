known_bugs:
  - severity: medium
    note: "Size guard is a SIZE guard, not a TYPE guard (vmhook.hpp:~15602): a same-width wrong-KIND static write (set(float) into 'I', set(int32) into 'F', set(double) into 'J') passes and memcpy's the raw bit pattern verbatim. Shared with field_primitives_set / field_proxy_set_guards; characterised, not fixed."
  - severity: medium
    note: "set() returns void (no programmatic signal on a refused write — size mismatch / non-primitive / null only emit a log line). The static module works around this by re-reading through get() AND pulling each value back through a Java getter (getstatic) so a silently-dropped write is caught two ways."
  - severity: low
    note: "Inherited-static addressing depends on entry->declaring_klass: a static offset is relative to the DECLARING class's mirror, not the requesting klass's (they differ for an inherited static with a differently-sized mirror oop). The resolver falls back to declaring_klass when set; a future find_field that drops declaring_klass would mis-address an inherited static."
notes: |
  Static fields live on the java.lang.Class mirror on every supported JDK (8..26); find_field walks
  InstanceKlass metadata uniformly (JDK 8-17 Array<u2> _fields vs JDK 21+ _fieldinfo_stream). GET re-resolves
  the GC-stable mirror at read time so a G1-relocated mirror never reads a stale slot. The fixture
  (vmhook/fixtures/FieldStatic) proves each write two ways: a mode-driven probe snapshots each field into a
  seen* witness via real getstatic/putstatic, AND each value is pulled back through static_method("getX").
  Java-8-only fixture (no var/records, (char)0x.. literals only); MSVC copy-init (std::string s = proxy->get(),
  never brace-init); every wrapper deref off a decoded OOP gated by is_valid_pointer. Field module — no hooks
  needed; if one is installed to satisfy a dispatch contract it is scoped_hook and disarms on scope exit;
  never calls shutdown_hooks().
