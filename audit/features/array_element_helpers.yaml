known_bugs:
  - severity: high
    note: "index * sizeof(element_type) offset computed in 32-bit (int32 * int32 multiply) overflows before addition; bounds check only verifies index < length, not index*stride in range (lines 11579, 11604). Fix: compute offset in std::size_t or std::ptrdiff_t."
  - severity: high
    note: "array_length() reads _length with zero sanity bound (line 11550); a valid-looking but garbage _length value flows into consumer reserve() calls (11764), triggering unbounded allocation / std::bad_alloc → std::terminate on noexcept code (11747)."
  - severity: medium
    note: "is_valid_pointer checks header address only (11545/11568/11595), not element address touched by memcpy (11579/11604); element access can straddle unmapped pages and fault despite header being mapped (no OS page-state query, only range/alignment/sentinel)."
  - severity: medium
    note: "get/set_array_element are not noexcept (11564, 11591) but memcpy can SEH fault on Windows; callers (append_array_value, read_array_value at 11679-11769) advertise noexcept and cannot honour hard-fault contract."
  - severity: low
    note: "No static_assert against pointer/reference element types (11567, 11594); trivially_copyable permits T*, but Java reference arrays store 4-byte compressed OOPs; reading as native 8-byte pointer width yields garbage (documented hazard, not defect in supported usage)."
notes: |
  Array layout offsets (+12 for `_length`, +16 for `_data[0]`) assume compressed-OOP x64
  layout with `UseCompressedClassPointers` enabled (default JDK 8–26 under typical heap sizes).
  With compressed pointers disabled, `_length` shifts to +16 and `_data` to +24 — all helpers
  read wrong slots silently. JDK 8 String backing is `char[]` (signature `[C`, uint16 stride);
  JDK 9+ is `byte[]` (signature `[B`, uint8 stride); consumers dispatch on signature. Compressed-OOP
  reference-array decode (11694, 14821, 15279, 15670) assumes 4-byte element stride; under
  `-XX:-UseCompressedOops` reference elements are 8 bytes and `get_array_element<uint32>` reads half a slot.
