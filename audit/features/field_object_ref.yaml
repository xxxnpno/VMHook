known_bugs:
  - severity: medium
    note: "FLAW A — no wrapper-klass match check (cast_for_variant unique_ptr arm, vmhook.hpp:15113-15133): a Ref-typed slot read through an UNRELATED Decoy wrapper is NOT rejected. decode_oop_pointer + is_valid_pointer only prove the OOP is a plausible heap pointer, not that it is an instance of the requested wrapper's klass — the decoy's field offsets then read garbage off a real-but-wrong object. Surfaced as [INFO] and asserted against actual behaviour."
  - severity: medium
    note: "FLAW B — no signature-shape check (vmhook.hpp:15113-15133): a '[' (reference-array) field read as unique_ptr<W> is NOT rejected; the wrapper ends up pointing at the array oop rather than an element. The arm only branches on stored_type == uint32 and the target being a unique_ptr, never inspecting signature_text[0]."
  - severity: low
    note: "FLAW C (FIXED, pinned as regression) — get_compressed_oop() now guards on is_reference() (vmhook.hpp:15703-15705) so a primitive 'I' field returns 0 instead of the int's first 4 bytes mis-decoded as a wild OOP. Pinned so a future regression of the guard trips a test."
notes: |
  JDK-independent proof: the field reference path reads a real compressed OOP straight from the slot, so a
  non-null ref yields a usable wrapper on EVERY JDK (8..26) — unlike the method-return twin which
  truncates/frees a JNI handle on JDK 21+. Compressed-OOP layout is assumed (HotSpot default sub-32 GB
  heap); -XX:-UseCompressedOops makes reference slots 8 bytes and the 4-byte uint32 read would be wrong
  (out-of-test hazard shared with field_string / field_arrays_object). Static-field reads re-resolve the
  GC-stable mirror at read time; instance reads use oop+offset. Module proofs: non-null ref yields a usable
  wrapper (read int/String/nested-ref fields AND dispatch a method through it); null ref (instance + static)
  -> empty unique_ptr; self-ref decodes to the receiver; shared ref -> same heap address; get_compressed_oop()
  round-trips re-encode(decode(x)) == x; operator void* agrees with field_oop(). Java-8-only fixture
  (vmhook/fixtures/FieldObjectRef); MSVC copy-init (= proxy->get(), never brace-init); every decoded-OOP
  deref gated by is_valid_pointer; never calls shutdown_hooks().
