known_bugs:
  - severity: low
    note: "Silent failure on a null primitive JNI slot: every primitive branch in call_jni's switch does `if (!fn) return value_t{monostate}` with NO VMHOOK_LOG, whereas the sibling V and L/[ branches both log a 'slot N is null' diagnostic. A corrupt/unsupported JNI function table only surfaces for void/object returns; an ()I method silently returns a monostate that converts to 0."
  - severity: low
    note: "case 'F' bit-cast routes through SIGNED int32_t then memcpy — the value is an opaque IEEE-754 bit pattern, not a signed int, and the upper 32 bits of result_holder are call-stub garbage. uint32_t would document intent; case 'D' already uses the full width directly, so F is the odd one out. Same behaviour on the x64 target (clarity, not correctness)."
  - severity: low
    note: "monostate collapses 'void return' and 'dispatch failure': value_t returns monostate for a legitimate ()V success AND for every failure path (no env, malformed sig, null method id, null slot, Java exception), so is_void() cannot tell them apart — a failed ()I and a successful ()V look identical to a caller without is_void()."
notes: |
  call() first checks find_call_stub_entry(); the converted value_t is identical
  on either dispatcher, so the module RECORDS which path is live and asserts the
  path-independent value. The only way to drive call() from a test is from inside
  a hook detour (current_java_thread is set only while the Java thread executes
  inside the interpreter detour), so the module hooks a trigger method and
  performs every call() there. sig_char_to_basic_type maps the return-type char to
  a HotSpot BasicType id (T_BOOLEAN=4 ... T_VOID=14); V->14 tells the call-stub not
  to write a result. Java-8-only fixture, ASCII strings.
