known_bugs:
  - severity: high
    note: "read_array_value violates noexcept on bogus _length (11376) — reserve(static_cast<size_t>(length)) throws std::bad_alloc after only length<=0 guard; torn/corrupted/racing _length (e.g. 0x40000001) or legitimately huge array kills JVM via std::terminate. Fix: clamp length to per-element byte ceiling and VMHOOK_LOG + return {} on overflow, or drop noexcept and catch."
  - severity: high
    note: "No element-width validation — silent OOB / silent garbage (11360) — signature forwarded only to vector<char> overload; numeric reads ignore it. vector<int64_t> over [I (4-byte) array reads array_oop + 16 + N*8, walking past data. Index-only bounds check (11185) does not catch byte-extent overflow. Exercised crash-safe direction only: [J into vector<int32_t> reads interleaved low/high words {long0_low, long0_high, long1_low}."
  - severity: medium
    note: "char[] -> vector<char> lossy narrowing (11317) — reads uint16 and static_cast<char> drops high byte; code units > 0xFF lose data silently. Verified: {0x61, 0x00FF, 0x0100, 0x20AC} becomes {0x61, 0xFF, 0x00, 0xAC}."
  - severity: medium
    note: "array setters silently no-op on null backing array (15339/15371/15417) — all if (!array_oop) return; with no log, diverging from v0.4.4 scalar set stance. Also silent truncation when values.size() disagrees with Java length (min(...) at 15348/15380/15426)."
notes: |
  Compressed OOPs: read assumes 32-bit compressed array references (decode_array_oop); with -XX:-UseCompressedOops
  or >32 GB heap the field stores full 64-bit OOP and uint32 variant would be wrong. Array header size: +12 length / +16 data
  offsets are standard compressed-OOP HotSpot array layout on JDK 8..25 with default flags, not guaranteed under
  -XX:ObjectAlignmentInBytes tweaks or non-HotSpot VM. char/byte storage: Java char[] always 16-bit (no compact-string effect).
  Fixture source is pure ASCII so it compiles under any javac -encoding on 8..25 matrix.
