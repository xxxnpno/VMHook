known_bugs:
  - severity: high
    note: "Z raw-memcpy into bool can synthesize non-canonical bool (11558-11560). bool value{}; memcpy(&value, ptr, sizeof(value)) copies raw byte straight into bool with UB on any non-0/1 value. Every sibling site normalizes (method_proxy::call does (raw & 1), [Z array reader does != 0); only get() reads raw. Fix: read through uint8_t then raw != 0."
  - severity: high
    note: "Z reads sizeof(bool), not 1 byte (11558-11559). Implementation-defined width; on ABI where sizeof(bool) > 1 this over-reads past 1-byte JVM Z slot into next field. Unlike set() (gated by jvm_primitive_byte_width), get() has no width guard."
  - severity: high
    note: "Null-pointer fallback returns wrong variant alternative for every signature (11551-11554). Null J/D/F/C proxy returns int32_t{0}, not descriptor's alternative, so std::holds_alternative<int64_t> false for long and std::get<bool> throws bad_variant_access."
  - severity: high
    note: "static_cast<int>(NaN/Inf) is UB and static_cast<bool>(NaN) is true (cast_for_variant generic 11462-11465). Reading F/D field holding NaN/±Inf into integer executes UB static_cast per [conv.fpint]; NaN float to bool silently reports true."
  - severity: medium
    note: "Java char > 0x7F silently narrows when target is C++ char (cast_for_variant generic). get() loads full uint16_t correctly but char c = proxy->get() truncates: U+4E2D becomes 0x2D, U+00E9 becomes negative char. Lossless char16_t/uint16_t path correct; only 1-byte target loses data."
  - severity: medium
    note: "No diagnostic on unknown/malformed signature (11605-11608). Typo'd descriptor (Q, empty) silently falls through to 4-byte compressed-OOP read and uint32_t alternative, unlike set() which logs and guards."
  - severity: low
    note: "Doc drift: doc-comments at vmhook.hpp:1447 and 6821 reference field_proxy::get_as<T>() which does not exist. Class exposes only get()/set()/signature()/raw_address()/is_static()/get_compressed_oop()."
notes: |
  NaN canonicalization: HotSpot stores Float.NaN as canonical qNaN 0x7FC00000 (double 0x7FF8…).
  Signaling-NaN or payload NaN written via intBitsToFloat must survive get()'s memcpy untouched on every JDK 8..26 —
  any float→double→float promotion would canonicalise payload, so F/D values are read into matching type only and bit-checked.
  char encoding: fixture uses numeric/\uXXXX literals only (pure ASCII) for javac portability across Windows (Cp1252) and Unix (UTF-8).
  GCC portability: static_field("name") used for all static context (always available); get_field() reserved for true instance (deducing-this overloads absent on GCC).
  Compressed OOPs: reference/array fall-through reads 4-byte narrow OOP (default); out of scope for primitives but instance field is real reference for JDK portability.
