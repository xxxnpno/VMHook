known_bugs:
  - severity: medium
    note: "Two distinct hook_handles for the SAME shared i2i entry (e.g. a duplicate-install scenario): when the first stop() erases the g_hooked_methods entry, the second handle's stop() find_if returns end() and no-ops (double-free-safe, vmhook.hpp:11140-11155). Correct, but means the second handle silently believed it owned a live target — the duplicate-membership short-circuit at install hands back an empty handle precisely to avoid this, so a caller bypassing that contract could be surprised."
  - severity: low
    note: "stop() deliberately leaves _code / _from_compiled_entry / _from_interpreted_entry untouched (vmhook.hpp:11162-11172) — the captured nmethod may have been flushed by the code-cache sweeper between install and stop, so writing it back would hand the JVM a dangling code-cache pointer. Byte-exact restore is therefore NOT a literal entry-point rewrite; it relies on common_detour skipping the erased method + the i2i allow-through. A future JDK whose i2i allow-through path changed would need this re-examined."
notes: |
  This is the single-hook remove path. Its siblings: scoped_hook RAII proves the scope-exit auto-removal;
  hook_reinstall_after_shutdown / shutdown_hooks_teardown prove the bulk reset. This module zeroes in on
  hook_handle::stop() idempotency and its double-remove / double-restore safety. The load-bearing
  invariant is byte-exact-original restore: after a remove, real Java bytecode dispatch must observe the
  unmodified original method body, not merely 'the detour stopped firing'. The second explicit stop() and
  the destructor's third stop() are guaranteed no-ops because method is nulled before the work and the
  idempotency gate short-circuits. Tests cover JDK 8..26 HotSpot. Hooks via scoped_hook<T> that disarm on
  scope exit; the module leaves NOTHING armed and NEVER calls shutdown_hooks() except where the bulk-reset
  contract is explicitly under test. Java-8-only fixture; MSVC copy-init; every Method* / decoded-OOP deref
  gated by is_valid_pointer.
