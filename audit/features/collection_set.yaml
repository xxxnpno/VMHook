known_bugs:
  - severity: medium
    note: "`Collections.newSetFromMap(new HashMap<>())` decodes to EMPTY for a non-empty Set (cascade 14863-14872 + tree walker 15539-15543). The wrapper `Collections$SetFromMap` stores its backing map in field `m` (same probe as TreeSet), routing to `tree_map_walk_keys`, which does `find_field(mapKlass, \"root\")`. HashMap has no root, so the walker returns empty at 15543 with no throw."
  - severity: medium
    note: "Field-name precedence is structural and fragile for any future Set impl (cascade 14803-14872, resolver walks supers at 11025). Routing by field name alone with no klass-name assertion — e.g. a custom Set with inherited `int size` and `Object[] elementData` would be mis-decoded as an ArrayList."
  - severity: low
    note: "LinkedHashSet insertion order is silently lost (hash_map_walk_keys 15362-15400 ignores the LinkedHashMap's before/after overlay). Walk is correct as a set (every element once) but in bucket order, not Java-contract insertion order."
  - severity: low
    note: "Hard element caps can silently truncate a pathological Set (HashSet walker caps each bucket at 1 << 20 nodes at 15368-15370, TreeSet caps total visited at 1 << 24 at 15617-15620). Anti-runaway guards that would silently drop tail on a legitimately enormous Set."
  - severity: low
    note: "No element-count cross-check against Set.size() — neither walker compares emitted count to the backing map's size field, so partial walk returns a short-but-non-throwing vector that looks like a smaller Set."
notes: |
  Compressed OOPs are assumed unconditionally — every node/array read is a 32-bit load + decode;
  uncompressed oops (`-XX:-UseCompressedOops`) would read garbage. HashMap.Node field names
  `key`/`next` and TreeNode inheritance are stable JDK 8..21+. TreeMap layout (root/Entry/left/right)
  stable since Java 1.2. HashSet.map/TreeSet.m field names are JDK-stable. HashMap treeification
  thresholds (TREEIFY_THRESHOLD=8, MIN_TREEIFY_CAPACITY=64) are OpenJDK 8+ details the fixture relies on.
  String element decode is delegated to read_java_string (Java 9+ compact strings vs Java 8 char[]).
