schema_version: 1
slug: method_flags_width
title: Method Flags Width
category: method
status: seeded
risk: high
specialist: .claude/agents/method_flags_width-specialist.md
description: |
  The width-correctness of `vmhook::hotspot::method`'s two flag accessors —
  `get_flags()` (HotSpot `Method::_flags`, home of `_dont_inline`) and
  `get_access_flags()` (HotSpot `Method::_access_flags`, home of `JVM_ACC_*`
  including `JVM_ACC_STATIC` and the `NO_COMPILE` mask). The crux: HotSpot's
  `Method::_flags` has changed BYTE WIDTH across JDK generations (u1 -> u2 -> u4
  + a sibling `_flags2`), yet vmhook reads/writes it through a HARD-CODED
  `std::uint16_t*` (`get_flags` returns a `uint16_t*`, and `set_dont_inline` does a
  non-atomic read-modify-write `*flags |= (1<<2)` / `&= ~(1<<2)`). This specialist
  owns whether vmhook reads the right bytes, writes only the right bytes, and never
  clobbers the adjacent Method field on a width mismatch. `get_access_flags()` is
  safe at u32 across all JDKs (AccessFlags is a 4-byte int-backed wrapper and every
  bit vmhook reads lives in those 4 bytes); only `get_flags()` is width-fragile.
java_versions:
- 8
- 11
- 17
- 21
- 24
- 25
- 26
tags: [method, flags, access-flags, width, abi, dont-inline, no-compile, vmstructs]
hpp_anchors:
  - symbol: method::get_access_flags
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2728, 2770]
    note: "resolves the ('Method','_access_flags') VMStruct and returns a uint32_t* at this+offset; try/catch + VMHOOK_LOG; u32 width is safe across all JDKs"
  - symbol: method::get_flags
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2938, 2980]
    note: "resolves ('Method','_flags') and returns a HARD-CODED uint16_t* — the only width-fragile accessor; does NOT consult entry->type_string for the real width and has NO try/catch"
  - symbol: hotspot::set_dont_inline
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7514, 7560]
    note: "the ONLY consumer of get_flags(); non-atomic RMW `*flags |= (1<<2)` / `&= ~(1<<2)` with a hard-coded _dont_inline bit position (never looked up from gHotSpotVMIntConstants)"
  - symbol: method_proxy::is_static (the correct width-independent pattern)
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [17209, 17238]
    note: "reads get_access_flags() as uint32_t* and masks 0x0008 — width-independent because the static bit is in the low byte; the right contrast to get_flags()'s fixed-width read"
