known_bugs:
  - severity: high
    note: "get_flags() hard-codes std::uint16_t*; wrong width corrupts the adjacent field on JDK 8-12 (u1) and truncates on JDK 21+ (u4). Method::_flags is u1 on JDK 8..~12 (the RMW `*flags |= (1<<2)` reads+writes 2 bytes, so the byte at offset+1 — a DIFFERENT Method field — is read into the RMW and written back: silent adjacent-field corruption of a live Method), u2 on JDK 13..20 (what the code assumes; correct), u4 on JDK 21+ (a 2-byte read sees only the low half). get_flags ignores entry->type_string which carries the real width literal (u1/u2/u4/MethodFlags)."
  - severity: low
    note: "set_dont_inline hard-codes the _dont_inline bit position (1 << 2) rather than looking it up from gHotSpotVMIntConstants, and the RMW is non-atomic on a live Method word."
notes: |
  vm_struct_entry_t carries type_string (the HotSpot field-type literal, e.g.
  u1/u2/u4/MethodFlags), offset, and is_static but NO explicit byte-size field — the
  width must be inferred from type_string, which get_flags() ignores entirely. The
  NO_COMPILE mask (0x0F000000) and JVM_ACC_STATIC (0x0008) live within the safe u32
  _access_flags word. Install/teardown wiring touches both flag words together
  (install sets _dont_inline + NO_COMPILE; verify/repair re-applies on JIT drift;
  shutdown clears both). method_proxy::is_static demonstrates the correct
  width-independent approach (read as u4, mask 0x0008) and is the contrast to
  get_flags()'s fixed-width read. This is a no-JVM unit-tested feature
  (tests/test_method_flags_width.cpp).
