known_bugs:
  - severity: medium
    note: "First-call-wins module caching (get_jvm_module static at 1629-1634, get_vm_structs/get_vm_types statics at 1665-1680/1642-1657) latches no-JVM verdict permanently — JVM attached later is never seen; real early-init consumers hit this. Fix: re-probe while null or expose reset_jvm_module_cache()."
  - severity: low
    note: "register_class<T> leaves no rollback for partially-applied re-registration (6938/6944 map writes), but no-JVM path is clean (find_class checked at 6919 before both writes)."
  - severity: low
    note: "hook<T> no-JVM result depends on unregistered-type throw (8037-8040 → 8296-8299 catch), not explicit JVM-absence guard — two coincidences deep, contract holds today but fragile."
  - severity: low
    note: "read_java_string((void*)0x1) safety leans entirely on address-floor in is_valid_pointer (15726 → 1768-1783); committed-but-wrong-oop would pass range check and read from wrong location (15742-15762)."
notes: |
  No-JVM contract is JDK-independent (no JVM to vary), but absent symbols/structs produce safe-defaults uniformly across JDK 8..26. Module export names (gHotSpotVMStructs, gHotSpotVMTypes, jvm.dll/libjvm.so/libjvm.dylib) are stable; find_class graph strategy is JDK-adaptive (_klasses vs _dictionary selected at runtime, both probes null with no JVM); read_java_string String layout is JDK-versioned (compact-strings coder field JDK 9+) but moot on null-oop path. JNI fallback (jni_find_class_with_context_loader at 6377) also null with no JVM — context-loader resolution heuristics vary by JDK 8 but only when JVM attached.
