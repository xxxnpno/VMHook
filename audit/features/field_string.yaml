known_bugs:
  - severity: high
    note: "Non-ASCII silently becomes '?' on UTF-16 path (data loss, no log) — vmhook.hpp:15213 (and JDK-8 char[] twin at 15196). Any code unit >= 0x80 on coder==1 String replaced by '?'. JDK 21 \"日本語\" -> \"???\"  and \"A日BéC\" -> \"A?B?C\". Inconsistent with LATIN1 arm (15204) which keeps bytes >= 0x80 verbatim. Trivial UTF-8 encode would round-trip cleanly. Module asserts the lossy results so a future fix deliberately flips them."
  - severity: medium
    note: "4 KiB cap is a hard REJECT, not truncation — contradicts docstring — vmhook.hpp:15178 (length <= 0 || length > 4096 -> {}) vs doc at 15435-ish (\"Truncates strings longer than 4096 characters\"). 4097-char ASCII String returns \"\", not first 4096 chars. Sibling make_java_string truncates with std::min — opposite behavior. Module: getLen4096 passes full string; getLen4097 and getLen5000 return \"\"."
  - severity: medium
    note: "UTF-16 effective cap is 2048 *chars*, not 4096 — vmhook.hpp:15178 tests byte count (read at +12) before coder branch divides by 2 (15209). UTF-16 String hits cap at 2048 chars while LATIN1/char[] reach 4096. Platform-conditional, silent. Module: getCjk2048 (2048 chars, byteLen 4096) passes; getCjk2049 (byteLen 4098) rejected -> \"\"."
  - severity: medium
    note: "write_java_string ignores coder -> corrupts UTF-16 targets and silently truncates/partial-overwrites — vmhook.hpp:15256-15304. Detects only [C] vs other (JDK 8 vs 9+), never runtime coder. Writing into coder==1 String overwrites only low bytes of UTF-16 units (garbled); multi-byte UTF-8 input becomes mojibake. All failure paths (null oop, missing klass, missing value field, null array, writable <= 0) return with no log, unlike loud make_java_string. Module exercises: ASCII into LATIN1 backing of equal length round-trips; shorter write leaves tail (\"world\" <- \"hi\" -> \"hirld\", length stays 5); overlong write truncates (\"abc\" <- \"LONGER\" -> \"LON\", length stays 3); write into zero-length backing is no-op."
  - severity: low
    note: "Empty Java String logs a warning on every read — vmhook.hpp:15178-15183. length==0 funnelled into same warning_tag branch as corrupt header (\"either an empty string or the array header is corrupt\"). Hot loop over empty fields spams log. Module reads getEmpty and asserts \"\" (value correct; noise is defect)."
notes: |
  Compact strings (JEP 254, JDK 9+): entire GET/SET behavior hinges on coder field.
  Test JVM (Temurin 21) always takes has_coder branch; JDK-8 char[] arm is dead code.
  ASCII/Latin-1 store as coder=0; any cp > 0xFF promotes entire String to coder=1.
  Compressed OOPs: value read as 32-bit compressed OOP. -XX:-UseCompressedOops or
  >32 GB heap would break uint32 variant. Array header offsets +12 (length) / +16
  (data) are standard compressed-OOP HotSpot layout, stable on 8..25 default flags.
  Fixture encoding: non-ASCII content written as (char) 0x.. casts or literal char[],
  never \u/raw bytes dependent on javac -encoding, compiles identically under any
  locale on javac 8..25. CRITICAL: new String("literal") shares backing byte[] with
  interned literal, so in-place write_java_string would corrupt every copy across
  JVM. Every SET target in fixture built via new String(text.toCharArray()) or
  literal char[], never new String(String), to prevent this catastrophic data loss.
