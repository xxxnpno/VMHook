known_bugs:
  - severity: medium
    note: "Interface (and interface-default) methods are unreachable via get_method — superclass-chain-only walk (all four get_method overloads iterate k=k->get_super()). Any method declared only on an implemented interface resolves to nullopt with no hint. The module characterises defaultGreet() via the Dog wrapper as [INFO], never a failure. Fix: iterate Klass::_transitive_interfaces or do a vtable-index lookup."
  - severity: low
    note: "klass_from_oop reads the narrow klass unconditionally at oop+8 assuming UseCompressedClassPointers. Under -XX:-UseCompressedClassPointers the klass is a full 64-bit pointer and the u4 read at +8 yields a wrong klass. CI runs the default (compressed on under ~32 GB), so the headline runtime-type resolution is silently config-dependent."
  - severity: low
    note: "klass::get_name / symbol::to_string length clamp (>0x1000 -> empty) could truncate a legitimately long internal name to empty and trip runtime-klass resolution. Not reachable for the short InterfacePoly$Dog fixture; documented hazard."
notes: |
  The runtime-type headline rides entirely on decode_klass_pointer picking the
  right VMStruct era and on UseCompressedClassPointers being ON (default under
  ~32 GB heaps). read_java_string correctness for the woof/Rex/labrador reads
  branches on has_coder: JDK 8 char[]/UTF-16 vs JDK 9+ LATIN1/UTF16 by coder
  byte; all three values are ASCII so they hit the LATIN1 byte-per-char branch on
  9+. Interface DEFAULT methods are a Java 8+
  language feature; on every supported JDK the superclass-only walk misses them,
  so the [INFO] outcome is JDK-stable. The pet-slot identity proof is robust
  because the unique_ptr decode (11821-11848) is genuinely type-agnostic. The
  module installs NO hooks; every native observation is a side-effect-free read.
