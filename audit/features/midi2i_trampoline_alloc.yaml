known_bugs:
  - severity: high
    note: "Two hand-maintained copies of the resume-JMP byte offsets — ctor constants RESUME_JMP_OFFSET (0x73 Windows / 0x74 SysV, lines 6476/6575) vs. rewrite_chain_resume's private copy (lines 6921/6924) — can silently drift if the assembly array is edited and only the ctor constants are updated. verify_and_repair() would then patch the resume rel32 at the wrong byte offset, corrupting the live trampoline mid-flight. No static_assert ties them together."
  - severity: high
    note: "No self-validation that the baked offsets match the emitted assembly bytes. The je-delta write (6666), detour pointer bake (6692), and resume rel32 (6690) all assume JE_OFFSET, DETOUR_ADDRESS_OFFSET, and RESUME_JMP_OFFSET land on specific instruction bytes. A one-byte edit to the assembly array shifts every landmark; the constructor still sets error=false and returns a 'successful' hook that jumps to garbage."
  - severity: medium
    note: "Constructor swallows the allocation-failure exception instead of propagating it (6652-6663 catch and return). The class comment at 6444-6448 explicitly anticipates direct callers outside the hook<T> gateway who expect throw-on-failure; they receive a silent error-state object instead."
  - severity: medium
    note: "Destructor's 'byte 0 still 0xE9' restore guard (6780-6788) mis-fires under chaining: if a later hooker overwrote our injection point with their own 0xE9+rel32, byte 0 is still 0xE9, so we memcpy our stale saved bytes over their live JMP — silently un-chaining them. The check should compare all 5 bytes against our expected JMP (as verify_and_repair already does)."
  - severity: medium
    note: "verify_and_repair's re-chain (6860-6869) can adopt a since-unloaded hooker's trampoline: is_valid_pointer is a readability/region check, not a live-trampoline provenance check. A freed DLL whose page is still mapped execute passes the gate; a two-hop A->B->A cycle through a sibling is not detected."
  - severity: low
    note: "target+HOOK_SIZE resume assumes the injection window is exactly 8 bytes (HOOK_SIZE=8, line 6463). find_hook_location returns the start of the thread-state-write instruction (41 C6 87 disp32 imm8 = 8 bytes), which happens to be correct for all observed JDKs. A future JDK encoding the same write in fewer or more bytes would cause the trampoline to copy a split instruction and resume mid-instruction without any length-decode guard."
  - severity: low
    note: "allocate_nearby_memory page-walk (5817-5845) can issue up to ~512K os::query_region calls on a fully-reserved 2 GB span before giving up (the page_size fallback at 5824 combined with the ±INT32_MAX window). Correct but can stall for multiple milliseconds on first install in a dense address space."
notes: |
  Platform notes:
  - On Windows, os::allocate_rwx wraps VirtualAlloc(MEM_RESERVE|MEM_COMMIT, PAGE_EXECUTE_READWRITE);
    os::protect wraps VirtualProtect; os::release wraps VirtualFree(MEM_RELEASE). The two-phase
    protect sequence (allocate RWX -> write stub -> flip to execute-read, then flip target to
    execute-rw -> stamp JMP -> flip back) is required because W^X hardening (e.g. CET/DEP) can
    forbid simultaneous W+X; the implementation obtains RWX only for the brief write window.
  - On POSIX (Linux/macOS), os::allocate_rwx wraps mmap(PROT_READ|PROT_WRITE|PROT_EXEC) and
    os::protect wraps mprotect. The two-phase protect sequence is identical.
  - The SysV AMD64 trampoline (6579-6645) uses rdi/rsi/rdx for the three arguments and has no
    shadow space; the Windows x64 trampoline (6483-6544) uses rcx/rdx/r8 and allocates 0x20
    bytes of shadow space before the call. Both are selected at compile time via VMHOOK_OS_WINDOWS.
  - arm64 / iOS builds (!VMHOOK_RUNTIME_HOOKING_AVAILABLE) reach the early-return at 6454-6461
    and leave error==true; hook<T>() throws and no trampoline is allocated. Clean no-op on every
    unsupported ABI and JDK.
  - Trampoline lifetime is tied exclusively to shutdown_hooks(): hook_handle::stop() deliberately
    leaves the shared stub patch in place (one trampoline serves N methods on the same i2i stub).
    Processes that inject-and-forget without calling shutdown_hooks() keep every trampoline page
    mapped for the life of the JVM — expected behaviour, but worth documenting as a contract.
  - JDK version sensitivity: find_hook_location returns nullptr on any JDK whose i2i stub lacks
    both pattern_full and pattern_fallback. JDK 26+ validation should confirm the thread-state
    write is still encoded as 41 C6 87 disp32 imm8 (8 bytes) so HOOK_SIZE=8 remains correct.
