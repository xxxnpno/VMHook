hpp_anchors:
  - symbol: hotspot::midi2i_hook (ctor / dtor / verify_and_repair)
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [6447, 6960]
    note: "the whole feature: ctor validates chain_resume + bakes/patches the stub; dtor restores the original 5 bytes if target still starts 0xE9 then os::release; verify_and_repair (6847) re-chains a stomped stub"
  - symbol: hotspot::find_hook_location
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [5650, 5748]
    note: "scans the i2i stub for pattern_full (4-mov spill, JDK 8..early 21) else pattern_fallback (thread-state write, JDK 21 release / 22+); also back-scans locals_pattern to cache locals_offset; nullptr if neither hits"
  - symbol: hotspot::allocate_nearby_memory
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [5749, 5900]
    note: "the reachability allocator: clamps a [search_min, search_max] window to +/-INT32_MAX of the target, walks regions via os::query_region, tries granularity-aligned candidates through os::allocate_rwx; the returned block MUST be E9-rel32-reachable"
  - symbol: midi2i_hook::rewrite_chain_resume
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [6447, 6960]
    note: "recomputes the resume-JMP rel32 in place in the live trampoline; keeps a private second copy of RESUME_JMP_OFFSET per ABI that must stay in lockstep with the ctor constants"
