known_bugs:
  - severity: low
    note: "Two divergent return-char parsers in the same class: is_reference() uses find(')') (the FIRST ')'), the hot call_jni path's cached_ret_char uses rfind(')') (the LAST ')') and treats 'nothing after )' as 'V'. For every legal descriptor there is exactly one ')' so they always agree, but a malformed descriptor with two ')' (e.g. \"()L)V\") would be classified off different parens — so is_reference() is not guaranteed to predict the kind the dispatch path decodes for a hand-built illegal proxy."
  - severity: low
    note: "is_reference() ignores the cached_ret_char cache and re-scans signature_text on every call (cheap, but redundant with the lazily-populated cache the dispatch path uses)."
notes: |
  No correctness bug in is_reference() itself — for every well-formed JVM method
  descriptor it returns the right answer, and the malformed-input guards (npos,
  close+1 >= size) are exactly right, so it is UB-free on the degenerate inputs and
  on a null-Method* proxy (it never reads the Method* at all). is_reference is the
  no-JVM-driveable slice: hand-built proxies (method_proxy{nullptr, nullptr,
  std::string{"..."}}) bind pinned=false and exercise every branch without a JVM.
  Resolution entry points (instance get_method, free static_method) all return
  std::optional<method_proxy>; is_reference is read off the contained proxy
  regardless of which path produced it.
