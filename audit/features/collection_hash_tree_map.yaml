known_bugs:
  - severity: high
    note: "Whole feature silently mis-decodes when -XX:-UseCompressedOops is set — reads fixed uint32_t and decodes via narrow-oop (table 15266-15269, bucket head 15278-15280, key/value/next 15301-15326, root 15431-15434, left 15463-15466, right 15488-15513), but layout offsets hardcoded for narrow form (klass_from_oop +8/4B, array_length +12, get_array_element +16). Under 64-bit pointers, walks read low 32 bits, decode to nullptr, return empty with no error — size() vs to_entries().size() divergence with silent failure."
  - severity: medium
    note: "LinkedHashMap returns bucket order instead of insertion/access order — to_entries selects HashMap table path for anything with table field (15127), hash_map_walk_entries follows Node.next in bucket order (15323-15326), but LinkedHashMap preserves order via Entry.before/after which are never read (no before/after anywhere in header). Ordering contract violated silently; contents correct."
  - severity: low
    note: "TreeMap left-spine inner loop has no iteration cap — documented depth cap is visited > (1<<24) at 15516 in OUTER loop, but inner left-descent while at 15448-15467 has no counter and unbounded stack.push_back at 15462; left-pointer cycle in corrupt heap blows OOM before guard, unlike HashMap walker (15284 guarded only loop)."
  - severity: low
    note: "to_entries routing by field name with HashMap priority — get_field_by_oop_klass(table) probed before (root) at 15127 vs 15134; future Map with both fields force-routes HashMap path, future obfuscation that renames table falls through to empty result with no diagnostic (same flaw as high #1)."
notes: |
  Narrow-oop base/shift VMStruct names migrate across versions (JDK 8-16 Universe::_narrow_oop, JDK 17-24 CompressedOops::_narrow_oop, JDK 25+ CompressedOops::_base/_shift); decode_oop_pointer 4296-4340 handles all three, but a version whose names match none returns nullptr and walks silently empty. TreeMap.Entry layout (key/value/left/right/parent/color) stable since Java 1.2; walker resolves fields by name via find_field so robust to order shuffles. HashMap class renames (Entry pre-8, Node/TreeNode 8+) handled by field-name walking (key/value/next). Compressed oops is the dominant axis (flaw 1): on by default below ~32 GB heap, so CI always in supported regime; failure invisible until huge-heap or explicit disable. Compact strings (JDK 9+) only affect downstream read_java_string, not Map traversal.
