known_bugs:
  - severity: high
    note: "[STILL LIVE on JDK 21+] The call_jni 'L'/'[' branch returns a truncated, already-freed JNI handle for every non-String Object return: it keeps only the low 32 bits of a 64-bit JNI INDIRECT local-ref pointer and DeleteLocalRefs it on the next line. The unique_ptr arm then feeds those 32 bits to decode_oop_pointer, computing narrow_oop_base + (low32 << shift) — a garbage address neither the handle nor the heap OOP — which is_valid_pointer usually rejects (-> null unique_ptr) or occasionally accepts (bogus pointer). So a non-null Object-returning call() -> unique_ptr<wrapper> WORKS on JDK 8-20 (call-stub present) but silently yields null/garbage on JDK 21+ (call_jni). Fix: decode the local ref to its underlying OOP and store the full pointer, moving the DeleteLocalRef after the decode."
  - severity: medium
    note: "The encode_oop_pointer round-trip on the call-stub path is fragile when compressed oops are disabled — the uint32 variant alternative cannot represent a >32-bit narrow oop, so a large-heap / -XX:-UseCompressedOops configuration would lose the high bits even on the working path."
notes: |
  The variant's 'uint32 == compressed OOP' invariant holds on the call-stub path
  but is violated on the call_jni path (the high bug above). The companion comment
  claiming uint32 -> void* yields 'the FULL 64-bit decoded heap pointer' is true
  only on the call-stub path. String returns are decoded correctly on BOTH paths
  (read_java_string on the stub, GetStringUTFChars on call_jni), so the breakage is
  specific to NON-String reference returns. The module installs a scoped_hook on a
  trivial tick() and performs every object-returning call on self inside that
  detour (call() needs current_java_thread); $-nested wrapper registration is the
  established pattern. Every decoded-OOP deref is is_valid_pointer-gated.
