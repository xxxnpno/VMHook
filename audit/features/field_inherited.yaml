known_bugs:
  - severity: medium
    note: "Doc comment contradicts implementation (10713-10714, 10718-10719) — says 'Only the declaring class is searched - not superclasses' and 'full InstanceKlass._fields array is walked', yet code walks get_super() at 10756 and not-found log reads 'field not found in class hierarchy'. Users hand-roll super-walks for a feature already working."
  - severity: low
    note: "No cycle/depth guard on super-walk (10756) while all sibling walkers have caps — for_each_thread caps at 4096, find_class at <65536/<1048576, dictionary chain at <1048576. Corrupt/looping _super (teardown garbage or malicious RedefineClasses) spins forever; real hierarchies ~12 deep, 256 cap harmless."
  - severity: low
    note: "Negative results never cached (10767-10768 returns nullopt without inserting) — per-tick get_field('typo') re-walks child→mid→base→Object, re-parses _fields/_fieldinfo_stream, emits error_tag log every frame. find_class short-circuits misses via klass_lookup_cache; fields do not."
  - severity: low
    note: "Shadowing duplicates offsets across descendants in cache (key=target_klass,name at 10762) — 50 subclasses looking up inherited Object.hash store 50 identical inner entries; every new-subclass miss grabs g_field_cache_mutex. Memory waste + contention point, not a correctness bug."
  - severity: low
    note: "field_proxy cannot tell inherited from own (2510-2515 drops declaring klass and 16-bit access flags, keeping only is_static) — no declaring_klass() / is_inherited() / is_protected() / is_private() methods; access-level-independence proven behaviourally not via proxy introspection."
notes: |
  Field metadata layout splits across JDK versions: 8–17 use InstanceKlass._fields (Array<u2> of 6-slot FieldInfo);
  JDK 21+ use _fieldinfo_stream (UNSIGNED5-encoded). The super-walk is layout-agnostic (calls per-klass find_field);
  inheritance/shadowing assertions hold on both. Compressed oops/klass assumed (HotSpot default) — String shadow and
  reference inherited fields exercise decode_oop_pointer. Walk terminates at java.lang.Object (get_super()==nullptr),
  stable across all supported JDKs.
