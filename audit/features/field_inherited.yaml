    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [10728, 10769]
    note: "super-chain walker; loop at 10756, per-klass call at 10758, cache insert at 10762, not-found at 10767-10768"
  - symbol: "klass::get_super()"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2707, 2719]
    note: "returns Klass::_super from VM struct; nullptr for Object (terminator) or invalid pointer"
  - symbol: "klass::find_field(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2953, 3059]
    note: "searches only fields declared on this klass (no walk); with JDK-21+ find_field_in_stream variant at 2841-2933"
  - symbol: "find_field_in_stream"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [2841, 2933]
    note: "JDK-21+ FieldInfoStream variant; selected at 2980-2983 by probing _fieldinfo_stream existence"
  - symbol: "g_field_cache"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [10708, 10709]
    note: "unordered_map<klass*, unordered_map<string, field_entry_t>>; keyed by requesting target_klass, guarded by g_field_cache_mutex"
  - symbol: "object_base::get_field(name)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [10792, 13529]
    note: "caller that funnels through vmhook::find_field for inherited-walk"
  - symbol: "object_base::resolve_klass()"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [13847, 13884]
    note: "keys off C++ wrapper's static type (typeid(*this)) to determine chain start-point; uses type_to_class_map -> find_class, not live OOP header"
