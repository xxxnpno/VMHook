schema_version: 1
slug: unified_call_syntax
title: Unified Call Syntax
category: infra
status: seeded
risk: medium
specialist: .claude/agents/unified_call_syntax-specialist.md
description: |
  The C++23 deducing-this (explicit-object-parameter) overloads on
  vmhook::object<derived> that let the SAME call site — get_field("name") /
  get_method("name") / get_method("name","sig") — compile and resolve correctly
  from BOTH an instance C++ method (routes through the live OOP via `this`) AND a
  static C++ method of the wrapper (routes through the type_index-keyed
  static-mirror lookup), without the author picking a different spelling. The
  portable escape hatch static_field / static_method is always available. This is
  a pure compile-time / overload-resolution layer over the existing instance and
  static get_field/get_method in object_base. The feature gate is
  VMHOOK_HAS_DEDUCING_THIS (on only for MSVC + non-NDK Clang 18..19; GCC and
  Clang >= 20 compile the #else using-declaration fallback and have NO static
  get_field/get_method overloads — authors there MUST use static_field /
  static_method).
java_versions: [8, 11, 17, 21, 24, 25, 26]
tags:
- deducing-this
- explicit-object-parameter
- cpp23
- overload-resolution
- wrapper
- compile-time
- infra
- toolchain-gated
hpp_anchors:
  - symbol: "VMHOOK_HAS_DEDUCING_THIS feature gate"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [256, 261]
    note: "1 only when __cpp_explicit_this_parameter >= 202110L AND (__clang__ || _MSC_VER) AND !__ANDROID__ AND NOT (clang_major >= 20). Long rationale 232-255: GCC considers explicit-object overloads in static-call contexts and errors; Clang 20 changed overload resolution so a static-context get_field('x') binds the literal to the deducing-this overload — both fall to the #else path"
  - symbol: "vmhook::object<derived> (CRTP base)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [18701, 18811]
    note: "using object_base::object_base (18704). #if VMHOOK_HAS_DEDUCING_THIS deducing-this instance overloads get_field(this object_base const&, char const*) / get_method(...) take char const* (NOT string_view) and forward to self.object_base::get_field(name) (18726-18743); #else re-exposes inherited instance overloads via `using object_base::get_field/get_method` (18752-18754)"
  - symbol: "object<derived> static-context fallbacks + portable static accessors"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [18765, 18810]
    note: "gated static get_field/get_method(std::string_view) forwarding to object_base::get_field(type_index{typeid(derived)}, name) (18766-18782) — the overloads the deducing-this members fall through to in static context. Always-compiled portable static_field/static_method(string_view) (18788-18810) have byte-identical bodies (same typeid(derived) lookup)"
  - symbol: "object_base instance/static get_field & get_method (the substrate this routes to)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [17635, 18138]
    note: "instance get_field via typeid(*this)/find_field/static-vs-instance branch; static get_field(type_index) rejects a non-static field with nullopt; instance/static get_method walk the super chain / build a null-receiver proxy. The unified overloads are thin forwarders — all klass/field/mirror resolution lives here"
test_modules:
- tests/test_unified_call_syntax.cpp
