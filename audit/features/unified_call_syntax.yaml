audit_docs: []
known_bugs:
  - severity: high
    note: "The existing test is COMPILE-ONLY and asserts nothing about behaviour. tests/test_unified_call_syntax.cpp main() only prints OK and returns 0 — it never touches a JVM, never registers a class, never checks that an instance call vs a static call resolve to the right overload or return the right value. The entire runtime contract ('instance site reads the live OOP; static site reads the class mirror; both via one spelling') is UNVERIFIED. There is no live-JVM module for this feature."
  - severity: medium
    note: "Non-literal std::string name from an instance context silently routes through the STATIC lookup. The instance deducing-this overloads take `char const*` while the static fallbacks take `string_view`; a string LITERAL prefers char const* (instance, live OOP), but an lvalue std::string / std::string_view does NOT match char const* and instead binds the string_view static fallback (typeid(derived), class mirror). So `std::string n=...; get_field(n)` from an instance method reads the static mirror, not the live OOP — wrong-context resolution, easy to hit, completely untested. Arguably the most dangerous real trap in the feature."
  - severity: medium
    note: "object<void> (derived == void) silently breaks every static-context call. The forward declaration defaults derived to void; the static fallbacks compute typeid(derived). Instantiating vmhook::object<> / object<void> and calling a static accessor makes resolve_klass(type_index{typeid(void)}) look up void in type_to_class_map, never find it, and return nullopt forever — a runtime no-op with only a log line, no compile error. CRTP is supposed to be object<Self>; the = void default makes the misuse compile."
  - severity: medium
    note: "Instance path keys on typeid(*this) (dynamic type) but the static path keys on typeid(derived) (static CRTP parameter) — they diverge under multi-level inheritance. For correct CRTP (class W : object<W>) they agree, but for `class B : A` where `A : object<A>` a B instance resolves B's dynamic-type klass via an instance call while a static call resolves A's klass. The 'unified' site does NOT resolve the same Java class from the two contexts in a derived scenario. Subtle; only bites layered wrappers; untested."
  - severity: low
    note: "Doc/macro near-contradiction: comments around 232 / 18701 historically claimed GCC has the feature, but the gate excludes GCC (and now Clang >= 20). On those toolchains the deducing-this overloads are never emitted and authors must use static_field/static_method. The behaviour is intentional and explained in the rationale block, but the older 'GCC 14+' phrasing can mislead the next reader. Documentation defect, not a logic defect."
notes: |
  A thin forwarding layer: the deducing-this overloads do NOT use `derived`
  themselves (they slice the receiver to object_base const& and re-derive the
  klass via typeid(*this)); only the static fallbacks use typeid(derived). The
  char const* vs string_view split between instance overloads and static
  fallbacks is the intended instance-literal-vs-static-name discriminator, but it
  is also the source of the non-literal-std::string trap above.

  Test coverage TODAY: only tests/test_unified_call_syntax.cpp, which is
  compile-only (proves the header compiles on the building toolchain; asserts no
  return values, no overload selection, no JVM behaviour). The gap is a live-JVM
  module (tests/jvm/modules/unified_call_syntax.cpp does not exist yet) with a
  fixture carrying an instance field and a like-named static field with distinct
  values, proving the same spelling returns the instance value from an instance
  method and the static value from a static method, plus the flaw-targeted
  characterizations (non-literal std::string routing, object<void> no-op,
  multi-level CRTP divergence).

  Version axis is the TOOLCHAIN, not the JDK: VMHOOK_HAS_DEDUCING_THIS state only
  changes the spelling the author may use. The static-context calls exercise the
  java.lang.Class mirror path, so JDK 8 vs 9+ mirror/static-field-offset
  differences surface through the static fallbacks — but that exposure is inherited
  verbatim from resolve_klass / find_field / the _methods super-walk, with no
  extra guard added by this layer.
