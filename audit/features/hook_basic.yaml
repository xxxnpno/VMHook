known_bugs:
  - severity: high
    note: "Half-installed method permanently poisons re-install — push_back at 7982 happens before i2i install (8000) / midi2i_hook (8047-8051); on failure the entry is never erased, so every later hook<T>() short-circuits at 7908-7914 and returns true without installing."
    ref: "audit/findings/hook_basic_install.md"
  - severity: high
    note: "push_back can realloc g_hooked_methods while a sibling detour iterates it lock-free (7982 vs 5883) — UAF on hook.detour std::function cell.  Install mutex (7906) does not cover the reader."
  - severity: high
    note: "Auto-repair watchdog is dead after shutdown_hooks() + re-init (8116 ensure_started, g_shutdown_requested at ~8554 / g_started never reset) — first common_detour sees the shutdown flag (5853) and bails forever."
  - severity: medium
    note: "_dont_inline silently no-ops if Method._flags VMStruct is absent (set_dont_inline path), while NO_COMPILE via get_access_flags throws — half-applied inline guard with no diagnostic on future / patched JVMs."
  - severity: low
    note: "Pre-install Method-flag mutations (NO_COMPILE / _dont_inline, 7916-7923) leak on exception — no rollback, asymmetric with hook_handle::stop()."
notes: |
  Reference seed manifest — populated from .claude/agents/hook_basic-specialist.md and
  audit/LIBRARY_BUGS.md to demonstrate the schema's fully-loaded shape.  Other
  manifests stay stubbed until their specialist populates them.
