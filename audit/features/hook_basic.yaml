known_bugs:
  - severity: high
    note: "Half-installed method permanently poisons re-install. The `g_hooked_methods.push_back` at vmhook.hpp:10194 runs BEFORE the i2i install (10207-10266) and the deopt block (10287-10323). If `find_hook_location` returns nullptr (10209-10213) or `midi2i_hook` reports `has_error()` (10259-10262), the throw is caught at 10332 returning false, but the pushed `hooked_method` entry is never erased. Every subsequent `hook<T>()` for the same Method* hits the duplicate-membership short-circuit at 10104-10126 and returns true with `*already_hooked=true` — `scoped_hook<T>()` then hands back an empty handle (11217-11225) and the original throw is invisible. The library reports installed-or-already-active forever, yet no detour fires. Module assertion target: a deliberately-poisoned install (e.g. by stubbing find_hook_location) then a second `vmhook::hook<T>` MUST return false rather than the current true. Fix: push_back last, or scope-guard the post-push section."
    ref: "audit/findings/hook_basic_install.md"
  - severity: high
    note: "`g_hooked_methods.push_back` at vmhook.hpp:10194 can reallocate the vector while a SIBLING method's detour is mid-iteration at 7147 — `common_detour` reads the vector lock-free (see comment block at 6995-7028 and 7101-7104). The install mutex (10102) does not cover the reader; reserving capacity or swapping to a stable-address container (`std::deque`, intrusive list) closes the UAF on the `hook.detour` `std::function` cell. Already documented in the in-source comment at 7015-7028 as a known hazard."
  - severity: high
    note: "Auto-repair watchdog is dead after `shutdown_hooks()` + re-init. `ensure_started()` is called at 10328 on first successful install. `shutdown_hooks()` sets `g_shutdown_requested` and `common_detour` bails on it at vmhook.hpp:7105 (memory_order_acquire). If `g_shutdown_requested` / `g_started` are not reset by the shutdown path, the first post-re-init `common_detour` returns immediately at 7107 and the watchdog ensure_started no-ops on a still-true `g_started`. Re-init silently produces hooks that never fire. Already partly addressed by `reset_watcher_latches()` at 11055 but the install-side `g_started` latch needs the same treatment. Module assertion: hook -> shutdown -> hook again -> drive Java -> detour fire count > 0."
  - severity: medium
    note: "Pre-install Method-flag mutations leak on exception. `set_dont_inline(method, true)` at vmhook.hpp:10128 and `*flags |= NO_COMPILE` at 10135 happen BEFORE the throwing i2i-install / midi2i_hook allocation (10207-10266) and BEFORE the deopt block (10287-10323). On a throw the catch at 10332 returns false but the flag mutations are never rolled back — asymmetric with `hook_handle::stop()` (11092-11099) which DOES clear both via `set_dont_inline(false)` + `safe_access_flags_and(~NO_COMPILE)`. A failing install therefore permanently inhibits JIT on the target Method*."
  - severity: medium
    note: "`_dont_inline` silently no-ops if the Method `_flags` VMStruct is absent. `set_dont_inline()` set path takes the existing fault-safe RMW (commit 16e75d9 hardened the CLEAR path; SET stays atomic), but a JDK whose `_flags` width or VMStruct export is not recognised by the resolver returns nullptr and the call returns silently. `NO_COMPILE` at 10135 still works via `get_access_flags()` (throws on null at 10131-10134), so on a future/patched JVM the inline-guard is HALF-applied with no diagnostic — a JIT'd caller can inline past the i2i patch."
  - severity: medium
    note: "Argument-decode bounds guard at vmhook.hpp:9264-9268 is the only line standing between a typo'd offset table and a wild read off the stack. The compile-time `java_slot_offsets<tuple>` should never emit a negative or > 0xFFFF index in practice, but the static_assert tail at 9385 only rejects unsupported types, not bad indexes. If a future trait change misroutes a wide-primitive index, the silent return of `base_t{}` will be indistinguishable from a legitimate zero-valued long/double arg — and on detour the user sees a default-constructed arg with no log line. Module assertion: hook_basic.cpp verifies long/int boundary (long widens 2 slots, trailing int read from correct slot)."
  - severity: low
    note: "Doc/scoping risk: the legacy `frame::get_arguments<types...>()` path (audit feature `jni_arg_packing` historically called out at vmhook.hpp:5016 in older revisions; now lives elsewhere after refactor) has no long/double 2-slot widening. A hook author who calls `frame->get_arguments<long,int>()` BY HAND inside a detour — instead of letting the typed `hook<T>` callback decode for them — reads the trailing int from the long's high slot. The supported path (the typed callback driven by `wrapper_detour` at 10158-10178) is correct; the trap is in any manual frame walk."
  - severity: low
    note: "Static method detection at install is implicit: `find_class` + `_methods` walk at 10063-10094 matches by name and (optionally) signature with no ACC_STATIC filter. The wrapper_detour at 10158-10178 also makes no static-vs-instance distinction — `java_slot_offsets` simply lays out the user lambda's args from slot 0. A user who registers a callback whose first param after `return_value&` is `const std::unique_ptr<W>&` AGAINST a static method will silently decompress an oop out of arg-0 (the first real Java arg) and hand the user a wrapper that points at the wrong receiver. `static_method_only()` exists for the call path (vmhook.hpp ~18119 after the c6ae54f hardening) but the install side has no symmetric guard. Module assertion: hook_basic.cpp's static-method scenario asserts NO `self` and arg-0 decoded from slot 0."
notes: |
  JDK-version sensitivities. The i2i injection-point pattern in `find_hook_location`
  is matched against HotSpot interpreter-stub layouts; a JDK whose stub fails both
  patterns returns nullptr and triggers the half-install flaw above. Tests cover
  JDK 8..26 HotSpot. `Method::_adapter` is exported on JDK 8 via VMStructs but
  removed on JDK 9+, where `detect_adapter_offset_from_method` (vmhook.hpp ~7751
  after the c6ae54f safe_read hardening) heuristically recovers it; the deopt block
  at 10287-10323 falls back to the c2i-less path (forced clear of `_code` +
  redirect `_from_interpreted_entry` to i2i, accepting one cycle of stale-IC
  bypass) when adapter recovery fails. Compressed-OOP decode in extract_frame_arg
  at 9320-9333 uses the `bits <= 0xFFFFFFFF` heuristic — only relevant when
  `UseCompressedOops` is on (the default under ~32 GB heaps); `self` and any
  String arg are the typical decompression targets.

  Recent hardening that bears on this feature: c6ae54f hardened 8 residual cold
  reads on the detour/revive/shutdown/watchdog paths through `os::safe_read` (incl.
  `midi2i_hook::verify_and_repair` stub memcmp, `set_dont_inline` probe,
  `detect_adapter_offset_from_method` scan); 037660d fully fault-proofed the
  watchdog (reads + RMW writes); 16e75d9 (#37) replaced `set_dont_inline()`'s
  CLEAR-path atomic_ref RMW with width-correct safe_read+recompute+safe_write so a
  `hook_handle::stop()` against a Method* relocated by a JVMTI RedefineClasses no
  longer AVs on the no-SEH legs; b738d6c disables the auto-repair watchdog during
  the functional test suite (the watchdog stays the production default ON but is
  the suite's only detached thread — its cross-tick poll re-derefs a stale Method*
  that no harness `__try` can contain on clang/mingw windows). seh_invoke_detour
  at 7045-7072 is `__try/__except` only on real MSVC (gated by
  `_MSC_VER && !__clang__`); on MinGW + clang-on-windows it is plain catch(...)
  which CANNOT trap a hardware AV — every hook-side cold read on those toolchains
  must be safe_read-guarded.

  Test-fixture pointers: `vmhook/fixtures/HookBasic.java` exposes go/done + mode
  selector; `tests/jvm/modules/hook_basic.cpp` drives one probe cycle per scenario
  (done latches, each cycle resets it and sets mode on the rising edge of go).
  Seven scenarios cover instance touch(int), uninstall, static staticTouch(int),
  instance combine(int,long,int) (long widens 2 slots), static
  staticCombine(int,long,int), two distinct instances of touch (receiver demux),
  and wideArgs(boolean,double,String,int) — roughly 50 ctx.check() assertions.
  Exactly-once-per-call is proven by counting fires against Java-side dispatch
  counts and by upper/lower-bounding the fire count.
