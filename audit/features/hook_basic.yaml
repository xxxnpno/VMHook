schema_version: 1
slug: hook_basic
title: "Hook Install (basic)"
category: hook
status: in_progress
risk: critical
specialist: .claude/agents/hook_basic-specialist.md
description: |
  Installing a `vmhook::hook<T>` / `vmhook::scoped_hook<T>` on a Java method and
  having the detour fire on real bytecode dispatch — on both instance and static
  methods — seeing the correct `self`, decoding every argument correctly, and
  allowing the original method body to run through.  This is the central
  install path; nearly every other hook feature builds on top of it.
java_versions: [8, 11, 17, 21, 24, 25, 26]
tags: [hook, runtime, x86_64, install]
hpp_anchors:
  - symbol: "vmhook::hook<T>(name, callback)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7835, 7840]
    note: "thin overload — forwards with empty signature"
  - symbol: "vmhook::hook<T>(name, signature, callback)"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7850, 8125]
    note: "real install routine"
  - symbol: "common_detour"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [5846, 5912]
    note: "dispatch entrypoint — looks up Method*, scans g_hooked_methods, fires once via seh_invoke_detour"
  - symbol: "scoped_hook<T>"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8733, 8830]
    note: "RAII wrapper that calls hook<T>() and re-resolves Method* for a hook_handle"
  - symbol: "hook_handle::stop"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [8614, 8675]
    note: "uninstall path — erases entry + clears _dont_inline/NO_COMPILE (does NOT restore _code)"
  - symbol: "extract_frame_arg<T>"
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [7325, 7401]
    note: "per-arg interpreter-slot decode used by the typed callback path"
