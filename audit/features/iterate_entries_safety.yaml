known_bugs:
  - severity: medium
    note: "is_static is never consulted; entry->offset is read blindly for static fields where it is meaningless (HotSpot puts a static field's location in address, not offset). iterate_struct_entries hands back the entry without exposing/checking is_static, so a caller that looks up a static field and adds ->offset computes garbage. Latent today (all call sites query instance fields)."
  - severity: medium
    note: "ABI layout assumption: vm_struct_entry_t/vm_type_entry_t must bit-match libjvm's VMStructEntry/VMTypeEntry for the running JVM. ++entry strides by sizeof as the header declares it; any member add/reorder or 32-bit padding change makes the stride wrong and feeds misaligned/wild pointers to strcmp. No version/size sanity check. Low probability, unbounded blast radius."
  - severity: low
    note: "get_vm_*/get_jvm_module cache the FIRST resolution permanently, including a nullptr taken before libjvm was loaded (function-local statics). Touch a getter pre-JNI_CreateJavaVM and every later lookup returns nullptr forever, silently disabling all introspection. Order-of-first-call is load-bearing and undocumented."
  - severity: low
    note: "Terminator assumption is zero type_name, not a fixed count (the for-loop guards entry->type_name only). A corrupted/unterminated global makes the walk run off the array end until it hits a zero type_name — a long wild read. No max-iteration cap backstop; the field_name skip hardens the value path, not the length path."
  - severity: low
    note: "Linear O(N) scan on every call with no caching of the entry result; hot paths mitigate by caching the returned entry in a static const at the call site, but iterate_* re-walks from the head every call — a foot-gun the 'iterate' name underadvertises."
notes: |
  These two functions are unusually well-hardened (explicit null guards on every
  string arg, two-part loop guard, per-entry field_name skip); there is no
  out-and-out crash bug on the no-JVM / null path — exactly what the dedicated
  no-JVM test (tests/test_iterate_entries_safety.cpp, ~45 checks) proves. Risk is
  high by blast radius: every Symbol/Method/ConstMethod/Klass/oopDesc/
  ConstantPool/thread/compressed-oop offset path bottoms out here. The walker is
  version-agnostic but the NAMES it is asked for changed across JDKs
  (oopDesc._mark -> _markWord, Method._from_compiled_code_entry_point ->
  _from_compiled_entry, InstanceKlass._fields -> _fieldinfo_stream,
  CompressedOops/CompressedKlassPointers _base/_shift eras), so the miss ->
  nullptr path is load-bearing for cross-version support. Non-HotSpot / no-VM
  runtimes (Android ART, iOS) -> find_jvm_module nullptr -> graceful
  degradation, the most important cross-platform invariant.
