known_bugs:
  - severity: medium
    note: "value_t::to_vector maps onto Map field via collection::to_vector, which tries get(int) — wrong arity (Map.get(Object), not get(int)), silently invokes interpreter gate per element returning nulls instead of rejecting the type. Signature guard at 15659 (\"[L\"/\"[[\") skips arrays but does not guard against Map fields (\"L...;\"). Flaw exists at 14890 + 15685; symmetric guard at 11833-11836 exists for cast_for_variant<unique_ptr> but was never extended."
  - severity: medium
    note: "Generic to_vector fallback (14874-14902) blindly calls get(int) on any Collection after fast-path miss, including non-RandomAccess and Queue/Deque impls. PriorityQueue/custom-List get(int)=O(N) → O(N²) with N live call gates, no klass-shape confirmation. Comment at 14874 says \"only valid for List impls\" but is the only guard."
  - severity: low
    note: "Concurrent structural mutation races every walk helper — bucket rehash (HashMap), red-black rotation (TreeMap), node relink (LinkedList) can yield stale next/left/right compressed OOP. Bounds (1<<20 per bucket, 1<<24 visited entries, size-capped LinkedList) prevent infinite loop but not torn reads; returned vector can contain duplicates or miss entries."
  - severity: low
    note: "size() returns 0 indistinguishably for empty and for null/broken OOP (no klass / no size() method); is_empty() true both cases. Documented null-safe contract but caller cannot distinguish — latent foot-gun the tests must pin so contract never silently flips to sentinel."
  - severity: low
    note: "map and collection duplicate ~70 lines of klass helpers (15002-15073 vs 14666-14734); byte-identical get_field_by_oop_klass and get_method_by_oop_klass. Future fix to one (e.g. inherited-static mirror path) that misses the other would diverge silently — drift hazard flagged for parity regression test."
notes: |
  Feature depends on hard-coded field names stable across JDK 8/11/17/21/24/25/26: elementData/size (ArrayList),
  first/item/next (LinkedList.Node), map (HashSet), m (TreeSet), table/key/value/next (HashMap.Node & TreeNode),
  root/left/right (TreeMap.Entry). These are OpenJDK private names, not JLS-stable — non-HotSpot VMs (J9/GraalVM)
  or a future JDK rename silently drops to empty path with no diagnostic. HashMap treeification (JDK 8+) converts
  ≥8-collision buckets to TreeNode; hash_map_walk_entries/_keys rely on TreeNode exposing same key/value/next field
  names as Node (true through JDK 21 per 15243-15247). Compressed oops required (all JDK 8-26 heaps <~32GB default);
  -XX:-UseCompressedOops or huge heap silently breaks every walk. Java 21+ sequenced collections did not alter backing
  layout so unaffected through 21; JDK 26 Valhalla record/value-class flattening or field rename is a silent-break risk.
