    lines: [16871, 17050]
    note: "self-guards its backing Method* before anything (stale proxy can't AV); call-stub path has NO exception check/clear between the stub return and the value_t return"
  - symbol: method_proxy::call_jni (check_callee_exception)
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [16233, 16870]
    note: "runs check_callee_exception (16567) after EVERY JNI call: ExceptionCheck (228) + ExceptionDescribe (16, PRINTS and CLEARS) + Throwable.toString into the log; leaves the thread clean and returns the JNI default cell"
  - symbol: detail::jni_exception_clear
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [11677, 11710]
    note: "the module's defensive clear: idempotent — reads ExceptionCheck (228) and only calls ExceptionClear (17) when one is pending; bails if current_jni_env is null"
  - symbol: detail::find_call_stub_entry
    file: vmhook/ext/vmhook/vmhook.hpp
    lines: [15936, 15970]
    note: "the path-decider, memoised in a static so the call-stub-vs-JNI decision is resolved once per process and stable for the whole suite"
