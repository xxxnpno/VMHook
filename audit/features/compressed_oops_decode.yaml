known_bugs:
  - severity: medium
    note: "encode_oop_pointer silently maps any sub-base pointer to Java null (4418-4421: if decoded_address < narrow_oop_base return 0). When base is non-zero (typical for heaps 4–32 GB), any foreign/native/stale pointer encodes as 0 (null oop), so a write that should fail instead nulls a live reference. No diagnostic; both decode(0) and encode(out-of-range) return 0, making null indistinguishable from out-of-range from no-JVM."
  - severity: medium
    note: "encode_oop_pointer has no upper-bound or shift-residue check; static_cast<uint32_t> (4423) can truncate. The delta (addr - base) >> shift is computed in 64 bits then narrowed to uint32; for addresses past the representable range (4GB << shift), high bits are silently dropped, yielding a valid-looking but wrong narrow oop instead of detectable failure. Address not checked to be a multiple of (1 << shift), so encode(decode(x)) ≠ x for non-shift-aligned x."
  - severity: low
    note: "Doc/lookup-order mismatch (4296-4317, mirrored 4368-4385): comment says JDK 8-16 uses Universe::_narrow_oop, but code tries CompressedOops paths FIRST and falls back to Universe LAST. On real JDK 8-16 every cold decode does two full linear scans of gHotSpotVMStructs before hitting Universe (cached after first call, but first-call cost is ~thousands of strcmp iterations)."
  - severity: low
    note: "Field width assumed without consulting VMStruct type_string (4347-4348, 4415-4416): _base read as uint64, _shift read as uint32. Correct on LP64 but assumes ABI; on hypothetical big-endian target or non-LP64 JVM port, reinterpret_cast reads would mis-decode silently."
  - severity: low
    note: "No validation that resolved VMStruct entry has backing address (4347 / 4415 dereference entry->address without checking non-null). For a static field HotSpot stores the field address in entry->address; implicit trust that it is readable. If entry->address were null (field present in table but not relocated), decode would dereference null in noexcept function → hard crash, not graceful nullptr. Guard (is_valid_pointer / is_readable_pointer) used elsewhere in file but absent here."
notes: |
  JDK version sensitivities: codec correctness depends on which gHotSpotVMStructs row holds
  _base/_shift. Java 8–16 stores under Universe::_narrow_oop.{_base,_shift} (reached via third/last
  fallback, 4317/4338); Java 17–24 moved to CompressedOops::_narrow_oop.{_base,_shift} (first attempt,
  4304/4325, the happy path); Java 25+ dropped _narrow_oop prefix to CompressedOops::{_base,_shift} (second attempt,
  4311/4332). Heap-size driven: shift=0 for heaps <4GB (raw address), shift=3 for heaps up to ~32GB
  (8-byte alignment); very large heaps disable compressed oops entirely and consumer heuristic skips decode.
  Round-trip guarantees: only null is guaranteed (encode(decode(0))=0, decode(encode(nullptr))=nullptr);
  non-null round-trip requires a real heap base/shift from JVM, and non-shift-aligned addresses may lose
  low bits with no error due to flaw #2.
