known_bugs:
  - severity: medium
    note: "Sibling field-name/signature reads in klass::find_field() (3094, 3114) and klass::find_field_in_stream() (2975-2977, 2982-2984) use the same ConstantPool::get_base() array with u2 indices from metadata, but lack identical FIX B guards (no get_length() bound, no is_readable_pointer slot probe). They go straight to is_valid_pointer(base[index]), which dereferences before validating — identical AV hazard as the method path pre-FIX-B. The fix belongs in a shared helper (constant_pool::symbol_at(index)) used by all five call sites. JDK 8..early-21 hit klass::find_field; JDK 21.0.x+/22+ hit find_field_in_stream — different code on different versions."
  - severity: low
    note: "Negative/garbage _length silently disables the bound (2052: cp_length >= 0 && index >= cp_length). When _length reads as negative (including -1 sentinel and any corrupt jint), the length guard is skipped entirely, leaving only is_readable_pointer protection. Mitigated by slot probe and symbol::to_string length gate, but the precise case the feature targets (corrupted ConstantPool) is most likely to corrupt _length and turn the bound off. The length bound is best-effort fast-reject, not a guarantee."
  - severity: low
    note: "Index 0 (documented as unused/reserved in ConstantPool header at 1934) is not rejected — bound is [0, cp_length) not semantically-correct [1, cp_length). For valid method _name_index/_signature_index >= 1, so never fires green path; base[0] is caught by downstream is_valid_pointer. But documents flaw: a future fix to enforce [1, cp_length) is deliberately test-visible."
  - severity: low
    note: "No upper sanity cap on cp_length itself (get_length() returns whatever the _length slot holds at 1979, no ceiling). A corrupt huge positive _length (e.g. 0x7FFFFFFF) makes index >= cp_length vacuously false for every realistic u2 (max 65535), deferring all protection to slot probe. Real pools are small; a sane upper clamp would tighten the fast path but absence is not a crash."
  - severity: low
    note: "get_length() reads a 4-byte field via uint64_t offset with no readability check on the field address (1975 guards is_valid_pointer(this) — range/alignment only, no is_readable_pointer on this+offset). If this passes range/alignment/poison filters yet this+offset lands in unmapped page, the _length read itself can fault before any bound applies. Subtle, low-probability, but the only read in FIX B path crossing a VMStruct offset without region probe."
notes: |
  ConstantPool._length export presence drives the entire bound: exported → index bounded;
  absent → get_length() returns -1, bound skipped (only is_readable_pointer protects).
  The field has been stable VMStruct export on HotSpot 8..25; feature written to survive removal.
  ConstantPool header size (→ get_base() offset) varies by JDK — uses runtime iterate_type_entries("ConstantPool")->size,
  so base is correct across versions; missing type entry makes get_base() return nullptr.
  ConstMethod._name_index/_signature_index offsets VMStruct-resolved (2022/2080); present 8..25.
  Missing struct entry makes corresponding getter return nullptr (2026-2028 / 2084-2086).
  JDK 8 vs 9+ field-symbol path divergence (flaw #1): JDK 8..early-21 use klass::find_field Array<u2> (3094);
  JDK 21.0.x+/22+ use klass::find_field_in_stream (UNSIGNED5, 2975).
  Unguarded sibling reads split by version — corrupt-field-index test must run on both old and new JDK.
  Compressed class pointers / heap size irrelevant — CP entries are raw Symbol* (Metaspace), pure u2-index arithmetic, heap-config independent.
